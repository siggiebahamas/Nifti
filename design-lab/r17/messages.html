.op-acts{display:grid;gap:6px}.op-acts .btn2{justify-content:center}
.chips2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.frame-d{max-width:1180px}
.frame-p .hide-p{display:none}
.key2{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);font-weight:700}
</style>

      'The box already holds the right message for that order, outlined in yellow. Change a word or just tap <b>Send</b>.',
      'The order number rides along with the message, so they know which order you mean.',
      '<b>Other message</b> swaps in another ready message. <b>Write my own</b> clears the box.'],
    best: 'Speed. One tap from Orders, one tap to send.', give: 'Only one message shows at a time.'},
  {id: 'b', n: 'B', name: 'Pick a message', tag: 'Why you came + 3 ready messages', why: [
      'A yellow card at the top says why you came: "You tapped Remind them on PO-2026-0871 · price hold ends tomorrow".',
      'Under it, 3 ready messages for that situation. Each one has its own <b>Send</b> button. <b>Edit first</b> puts it in the box.',
      'Switch to <b>Filipino</b> and the 3 messages change to Filipino.',
      'After you send, the card turns green with <b>Back to Orders</b> and the next person who needs you. You never lose your place.'],
    best: 'Owners and staff who don\'t like typing, and anyone working through a list of people to chase.', give: 'Takes a bit more space above the chat until you send.', pick: 1},
  {id: 'c', n: 'C', name: 'Order beside the chat', tag: 'The whole order stays open on the right', why: [
      'On a laptop, the order sits in a panel on the right: what\'s in it, the total, where it is, and the one thing to watch.',
      'Above the box, tap-to-fill messages: <b>Remind about tomorrow</b>, <b>Offer 3 more days</b>, <b>Ask about changes</b>.',
      'On a phone, the order is a blue card at the top of the chat. Tap it to see the details.',
      'When you send, the order panel adds "Reminder sent" to its steps, so the order remembers what you did.'],
    best: 'Longer talks where you need the details: quantities, totals, dates.', give: 'Laptop needs a wider screen; the chat column is narrower.'}
];
const S = {v: 'b', view: 'both', step: 2, sc: 'r', lang: 'en', alt: 0, sent: null, chip: 0, open: false, undo: false, editing: null};
if(window.innerWidth < 700) S.view = 'p';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const sc = () => SC[S.sc];
const T = () => sc().t[S.lang];
const iniH = (n, s) => `<span class="ini" style="width:${s}px;height:${s}px;font-size:${Math.round(s / 2.9)}px">${ini(n)}</span>`;

function sideH(on){ return `<nav class="side"><div class="lg">Nifti</div>${[['home', 'Home'], ['truck', 'Orders'], ['msg', 'Messages'], ['box', 'Stock'], ['wallet', 'Money']].map(([i, l]) => `<span class="${l === on ? 'on' : ''}">${ic(i)}${l}</span>`).join('')}</nav>`; }

/* step 1: the Orders page you came from */
function ordersH(){
  const x = sc();
  return `<div class="ord"><h2>Orders</h2><p>Who needs you, and their orders under them.</p>
    <div class="hint">${ic('arrow')}Tap <b>${x.btn}</b> (or Message) to see what happens next.</div>
    <div class="ocard"><div class="oband ${x.y ? 'yel' : 'blue'}"><span>${x.y ? 'Coming up' : x.band2}</span><b>${x.y ? 7 : 4}</b></div>
      <div class="ogrp">${iniH(x.who, 44)}<div><div class="nm"><b>${x.who}</b><span class="tagw">${x.side}</span></div><div class="fx">${x.side === 'Customer' ? '11 orders · last 5 days ago' : '21 orders · last 5 days ago'}</div></div>
        <div class="dtile${x.y ? ' y' : ''}"><small>${x.mon}</small><b>${x.day}</b></div>
        <div class="orow${x.y ? ' y' : ''}" style="grid-column:2"><div><div class="l1"><b>${x.po}</b><span class="tagw" style="border-radius:8px">${x.step}</span>${x.items2[0][0]}</div><div class="l2"><b>${x.when}</b> ${x.rest}</div></div>
          <div class="bt"><b style="font-size:16px">${x.totalTxt}</b><button class="btn2 pulse" data-act="go2">${x.btn === 'Message' ? ic('msg') : ic('bell')}${x.btn}</button></div></div>
        <div style="grid-column:2;display:flex;gap:16px;font-size:14px;font-weight:700"><button class="link pulse" data-act="go2" style="border-radius:6px">Message</button><span class="link">New order</span></div>
      </div></div></div>`;
}

/* the chat history and anything just sent */
function bodyH(){
  const x = sc();
  return `<div class="body"><span class="daysep">Earlier</span>${x.hist.map(([w, t, d]) => `<div class="b${w === 'me' ? ' me' : ''}">${esc(t)}<small>${d}</small></div>`).join('')}
    ${S.sent ? `<span class="daysep">Today</span><div class="b me new">${esc(S.sent)}<span class="oc">${ic('file')}${x.po}</span><small>10:42 AM · Sent ✓</small></div>` : ''}</div>`;
}
function headH(){ const x = sc(); return `<div class="th-h"><button class="bk btn2" style="min-height:36px;padding:0 10px" data-act="go1">${ic('left')}</button>${iniH(x.who, 40)}<div><b>${x.who}</b><small>${x.side} · last active today</small></div><span class="sp"></span><button class="btn2" style="min-height:38px" data-act="toast" data-v="Calls them (prototype)">${ic('phone')}<span class="hide-p">Call</span></button></div>`; }
function clistH(){ return `<div class="clist"><h4>Chats</h4>${CHATS.map(([n, k, l]) => `<div class="ci${k === S.sc ? ' on' : ''}">${iniH(n, 36)}<div style="min-width:0"><b>${n}</b><small>${l}</small></div></div>`).join('')}</div>`; }
function langH(){ return `<span class="lang">${[['en', 'English'], ['fil', 'Filipino']].map(([k, l]) => `<button aria-pressed="${S.lang === k}" data-act="lang" data-v="${k}">${l}</button>`).join('')}</span>`; }

/* A: one ready message in the box, order pinned on top */
function vA(){
  const x = sc(), t = T()[S.alt % 3];
  const ready = S.editing === null ? t[2] : S.editing;
  return `<div class="msgs">${clistH()}<div class="thread">${headH()}
    <div class="pin">${ic('file')}<div><b>${x.po} · ${x.totalTxt}</b><small>${x.when} ${x.rest}</small></div><span class="lk" data-act="toast" data-v="Opens ${x.po} (prototype)">Open order</span></div>
    ${bodyH()}
    <div class="comp">${S.sent ? `<div class="rl" style="color:#146C3C"><b>${ic('check')}Sent. ${x.po} goes with it.</b><button class="btn2" style="min-height:36px" data-act="go1">${ic('left')}Back to Orders</button></div>` :
      `<div class="rl two"><b>${ic('spark')}Ready to send. Change anything you like.</b><span>${langH()}<button class="lk" data-act="alt">Other message</button><button class="lk" data-act="mine">Write my own</button></span></div>`}
      <div class="row"><textarea class="ta tall${!S.sent && S.editing === null ? ' ready' : ''}" rows="4" placeholder="Type a message…">${S.sent ? '' : esc(ready)}</textarea><button class="send big" data-act="sendA">Send ${ic('arrow')}</button></div></div>
  </div></div>`;
}

/* B: why you came + 3 messages with their own Send */
function vB(){
  const x = sc();
  const task = S.sent
    ? `<div class="task done"><small>Done</small><b>Message sent to ${x.who}</b><span>${x.po} is attached, so they know which order you mean.</span>
        <div class="acts"><button class="btn1 sm" data-act="go1">${ic('left')}Back to Orders</button><button class="btn2" data-act="toast" data-v="Opens the next chat (prototype)">Next: ${x.next} ${ic('right')}</button></div></div>`
    : `<div class="task"><small>Why you're here</small><b>${x.why}</b><span>${x.whyS}</span></div>`;
  const choices = S.sent ? '' : `<div class="choices"><div class="hd"><span>Tap Send on the one you like</span>${langH()}</div>
      ${T().map(([h, , m], i) => `<div class="ch"><div><div class="t">${h}</div><p>${esc(m)}</p></div><div class="cb"><button class="lk" data-act="edit" data-v="${i}">Edit first</button><button class="send" data-act="sendB" data-v="${i}">Send ${ic('arrow')}</button></div></div>`).join('')}</div>`;
  return `<div class="msgs">${clistH()}<div class="thread">${headH()}${task}
    ${bodyH()}
    <div class="comp">${S.undo ? `<div class="undo"><span>Sent to ${x.who}.</span><button data-act="undo">Undo</button></div>` : ''}${choices}
      <div class="row"><textarea class="ta" rows="${S.editing !== null ? 3 : 1}" placeholder="Or type your own message…">${S.editing !== null ? esc(S.editing) : ''}</textarea><button class="send" data-act="sendTa">Send ${ic('arrow')}</button></div></div>
  </div></div>`;
}

/* C: the order stays open beside the chat */
function vC(){
  const x = sc(), t = T();
  const steps = (S.sent ? [...x.steps.slice(0, 2), ['Reminder sent', 'today 10:42 AM', 'new'], ...x.steps.slice(2)] : x.steps);
  const stepsH = `<div class="op-steps">${steps.map(([a, b, c]) => `<div class="${c}"><i></i><span>${a}${b ? ` · <span style="font-weight:500">${b}</span>` : ''}</span></div>`).join('')}</div>`;
  const itemsH = `<div class="op-items">${x.items2.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join('')}<div class="tot"><span>Total</span><span>${x.totalTxt}</span></div></div>`;
  const actsH = `<div class="op-acts">${x.opAct.map(a => `<button class="btn2" data-act="toast" data-v="${a} (prototype)">${a}</button>`).join('')}<button class="btn2" data-act="toast" data-v="Opens ${x.po} (prototype)">Open the full order</button></div>`;
  return `<div class="msgs c3"><div class="thread">${headH()}
    <div class="pcard"><button data-act="pc">${ic('file')}<div><b>${x.po} · ${x.totalTxt}</b><small>${x.alert[0]}</small></div><span class="sp"></span>${ic(S.open ? 'up' : 'down')}</button>
      ${S.open ? `<div class="in2">${itemsH}${stepsH}<div class="op-acts">${x.opAct.map(a => `<button class="btn2" data-act="toast" data-v="${a} (prototype)">${a}</button>`).join('')}</div></div>` : ''}</div>
    ${bodyH()}
    <div class="comp">${S.sent ? `<div class="rl" style="color:#146C3C"><b>${ic('check')}Sent. Added to the order's steps.</b><button class="btn2" style="min-height:36px" data-act="go1">${ic('left')}Back to Orders</button></div>` :
      `<div class="rl" style="color:var(--ink2)"><b>Tap one to fill the box</b>${langH()}</div><div class="chips2">${t.map(([, c], i) => `<button class="${S.chip === i ? 'on' : ''}" data-act="chip" data-v="${i}">${c}</button>`).join('')}</div>`}
      <div class="row"><textarea class="ta tall" rows="4" placeholder="Type a message…">${S.sent ? '' : esc(S.editing !== null ? S.editing : t[S.chip][2])}</textarea><button class="send" data-act="sendTa">Send ${ic('arrow')}</button></div></div>
  </div>
  <aside class="opanel"><h5>The order</h5><div class="op-top"><b>${x.po}</b><span class="st"><i></i>${x.step}</span><span style="font-size:13px;color:var(--mut)">${x.who}</span></div>
    <div class="op-alert${x.y ? ' y' : ''}"><b>${x.alert[0]}</b>${x.alert[1]}</div>${itemsH}<h5>Where it is</h5>${stepsH}${actsH}</aside></div>`;
}

function page(){
  if(S.step === 1) return `<div class="app">${sideH('Orders')}<div class="main">${ordersH()}</div></div>`;
  return `<div class="app">${sideH('Messages')}<div class="main">${S.v === 'a' ? vA() : S.v === 'b' ? vB() : vC()}</div></div>`;
}
function render(){
  $('tabs').innerHTML = V.map(x => `<button class="lab-tab" aria-pressed="${S.v === x.id}" data-act="v" data-v="${x.id}"><i>${x.n}</i><b>${x.name}${x.pick ? ' · my pick' : ''}</b><small>${x.tag}</small></button>`).join('');
  $('r3').innerHTML = seg('vw', [['both', 'Laptop + phone'], ['d', 'Laptop'], ['p', 'Phone']], S.view, 'view') + seg('st', [['1', '1 · On Orders'], ['2', '2 · After you tap Message']], String(S.step), 'step')
    + `<div class="scn"><small>Situation</small>${[['r', 'Price hold ends tomorrow'], ['c', 'Supplier delivery check'], ['m', 'No answer in 6 days']].map(([k, l]) => `<button aria-pressed="${S.sc === k}" data-act="sc" data-v="${k}">${l}</button>`).join('')}</div>`;
  $('wrap').classList.toggle('wide', S.view !== 'p');
  const pg = page();
  const desk = `<div class="frame-d">${pg}</div>`, phone = `<div class="frame-p"><div class="notch"><span>9:41</span><span>●●●</span></div><div class="scroll">${pg}</div></div>`;
  $('stage').innerHTML = S.view === 'd' ? desk : S.view === 'p' ? phone : `<div style="flex:1 1 760px;min-width:0;display:flex;justify-content:center">${desk}</div><div>${phone}</div>`;
  const x = V.find(v => v.id === S.v);
  $('notes').innerHTML = `<h2>${x.n} · ${x.name}${x.pick ? ' <span class="pill green nodot" style="vertical-align:middle">My pick</span>' : ''}</h2><p class="tg">${x.tag}</p><h3>How it works</h3><ul>${x.why.map(w => `<li>${ic('check')}<span>${w}</span></li>`).join('')}</ul>
    <div class="box"><b>Best for:</b> ${x.best}</div><div class="box"><b>You give up:</b> ${x.give}</div>
    <div class="box"><b>All three:</b> Messages opens on the right chat, the order number goes with your message, and the ready messages change with the situation and language. Try the 3 situations above.</div>`;
}
function sendNow(text){ if(!String(text || '').trim()) return toast('Type a message first'); S.sent = text.trim(); S.editing = null; render(); }
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act, v = b.dataset.v;
  const ta = (b.closest('.comp') || document).querySelector('textarea'), fr = b.closest('.frame-p') ? '.frame-p' : '.frame-d';
  const focusTa = () => { const t = document.querySelector(fr + ' .comp textarea'); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } };
  if(a === 'toast'){ e.stopPropagation(); return toast(v); }
  if(a === 'v'){ S.v = v; S.sent = null; S.editing = null; S.undo = false; S.chip = 0; S.alt = 0; }
  else if(a === 'view') S.view = v;
  else if(a === 'step'){ S.step = Number(v); S.sent = null; S.editing = null; S.undo = false; }
  else if(a === 'sc'){ S.sc = v; S.sent = null; S.editing = null; S.undo = false; S.chip = 0; S.alt = 0; }
  else if(a === 'go2'){ S.step = 2; S.sent = null; S.editing = null; S.undo = false; }
  else if(a === 'go1'){ S.step = 1; S.sent = null; S.editing = null; S.undo = false; }
  else if(a === 'lang'){ S.lang = v; S.editing = null; }
  else if(a === 'alt'){ S.alt++; S.editing = null; }
  else if(a === 'mine'){ S.editing = ''; render(); focusTa(); return; }
  else if(a === 'sendA'){ return sendNow(ta ? ta.value : ''); }
  else if(a === 'sendTa'){ return sendNow(ta ? ta.value : ''); }
  else if(a === 'sendB'){ S.undo = true; clearTimeout(S._u); S._u = setTimeout(() => { S.undo = false; render(); }, 5000); return sendNow(T()[Number(v)][2]); }
  else if(a === 'undo'){ S.sent = null; S.undo = false; toast('Not sent'); }
  else if(a === 'edit'){ S.editing = T()[Number(v)][2]; render(); focusTa(); return; }
  else if(a === 'chip'){ S.chip = Number(v); S.editing = null; }
  else if(a === 'pc'){ S.open = !S.open; }
  render(); });
document.addEventListener('input', e => { if(e.target.classList.contains('ta')){ S.editing = e.target.value; e.target.classList.remove('ready'); } });
render();
</script>
</body>
</html>
