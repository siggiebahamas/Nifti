<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round 23 Choices</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../r13/lab.css">
<style>
.band{background:radial-gradient(800px 260px at 85% -20%,rgba(52,211,153,.35),transparent 60%),linear-gradient(135deg,#03251C 0%,#064E3B 55%,#0B6B57 100%);color:#fff;padding:34px 20px 80px}
.band .bin{max-width:1080px;margin:0 auto}.band a{color:#C8EFDF;font-size:14px;font-weight:700;text-decoration:none}
.band h1{margin:12px 0 6px;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.band p{margin:0;font-size:17px;color:#C8EFDF;max-width:660px}
.wrap{max-width:1080px;margin:-52px auto 0;padding:0 20px 60px;display:grid;gap:18px}
.live{background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);padding:18px 20px;display:grid;gap:10px}
.live h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}.live h2 span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--gbg);color:var(--g);border-radius:999px;padding:4px 10px}
.live ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}.live li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px;color:var(--ink2)}.live li b{color:var(--ink)}
.live li svg{width:20px;height:20px;padding:3px;border-radius:50%;background:var(--g2);color:#fff;stroke-width:3}
.audit{background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);overflow:hidden}
.audit h2{margin:0;padding:16px 20px 12px;font-size:18px;font-weight:800;border-bottom:2px solid var(--ink)}
.ar{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,2fr);gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:14.5px}
.ar b{font-size:15px}.ar span{color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.c{display:grid;gap:10px;background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);padding:18px 20px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;align-content:start}
.c:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.c .top{display:flex;align-items:center;gap:12px}.c .top span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#DDF5EC;color:#047857}.c .top span svg{width:24px;height:24px}
.c h3{margin:0;font-size:18px;font-weight:800;line-height:1.2}.c small{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.c p{margin:0;font-size:15px;color:var(--ink2)}.c .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--g);font-size:15px}
.c .opts{display:flex;flex-wrap:wrap;gap:6px}.c .opts i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--sf2);border-radius:999px;padding:3px 10px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:640px){ .band h1{font-size:28px} .band{padding:24px 16px 72px} .wrap{padding:0 12px 40px} .ar{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px} .ar span:last-child{grid-column:1/-1} }
</style>
</head>
<body>
<div class="band"><div class="bin"><a href="../">‹ Design lab</a><h1>Round 23 · what changed and what to pick</h1><p>Returns now use two money boxes, the online store is simpler, Books no longer repeats Money overview, and the notebook reader has its own menu line. Five things are waiting for your pick.</p></div></div>
<div class="wrap">
  <div class="live"><h2>Already in the app <span>Live</span></h2><ul id="live"></ul></div>
  <div class="cards" id="cards"></div>
</div>
<script src="../r13/lab.js"></script>
<script>
$('live').innerHTML = [
  ['Returns & credits: two money boxes', ': one box per side with the big number, each credit waiting, and the add button centered at the bottom. "Used credits" and "Problems reported" fold open below each box.'],
  ['Telegram alerts on your phone', ': the menu link says exactly that. Viber alerts are not ready (Viber charges a monthly fee and needs approval), so every mention of Viber alerts is gone. Sharing a post or a reminder by Viber still works.'],
  ['Online store, simpler', ': "Post today" and "Make a post" are one tab: Nifti\'s pick, or tap the kind of post you want and the picture and words change in place. My week opens each day right where you tap it and shows the picture. Get more buyers is 6 small steps, Reply fast is 2 taps.'],
  ['Books: nothing shown twice', ': monthly profit and money in and out live on Money overview only. Books keeps What changed, What you own and owe, and Every peso (ledger), in the Money overview colors. Accountants still get every statement.'],
  ['Ledger that lines up', ': "What" on the left, money on the right, green for money in and red for money out. On a phone each line is one tidy row.'],
  ['Mini tabs gone from Books', ': Reports, Tax books and BIR 2307s each have their own menu line, so the small gray row is removed.'],
  ['Tax books totals labeled', ': every total says what it is (Gross, Exempt, Vatable sales, VAT, Withheld).'],
  ['AI tools in the menu', ': "Notebook reader" sits right under Stock on a computer, and first on the phone menu.'],
  ['"What\'s this page?" centered', ': it now sits in the middle of the title\'s height on every page.']
].map(([b, t]) => `<li>${ic('check')}<span><b>${b}</b>${t}</span></li>`).join('');
$('cards').innerHTML = [
  ['beforeafter.html', 'clock', 'Landing page: your day, hour by hour', 'Pick one', 'Five takes on the hour-by-hour idea. Times and summary boxes you can read, "before" in dark text, and before and after always the same size.', ['1 · Light page (my pick)', '2 · Dark green, solid', '3 · Timeline', '4 · Night to day', '5 · One card per hour']],
  ['colors.html', 'tag', '"All good" vs the emerald buying side', 'Pick one', 'Three greens that can\'t be mixed up with emerald, and three colors that aren\'t green. Each shown inside the real Orders columns.', ['A1 · White, green outline (my pick)', 'A2 · Lime', 'A3 · Forest', 'B1 · Gray', 'B2 · White, dark outline', 'B3 · Teal']],
  ['taxbooks.html', 'receipt', 'Tax books: 3 simpler layouts', 'Pick one', 'One line per invoice instead of seven rows, totals with labels, and plain words for what each number means.', ['1 · One line each', '2 · Grouped by day', '3 · Your VAT first (my pick)']],
  ['notebook.html', 'cam', 'Notebook reader: its own page', 'Pick one', 'Snap a page and Nifti works out what it is, puts each line in the right place and takes you there. Three ways it can look.', ['A · One big button (my pick)', 'B · Pick the page first', 'C · Chat with Nifti']],
  ['helpbutton.html', 'star', '"What\'s this page?": 3 looks', 'Pick one', 'Easier to notice than today\'s gray outline, never loud. Each shown beside real page titles.', ['1 · Soft green (my pick)', '2 · Slate with a light bulb', '3 · Plain link']]
].map(([h, i, t, n, p, o]) => `<a class="c" href="${h}"><div class="top"><span>${ic(i)}</span><div><small>${n}</small><h3>${t}</h3></div></div><p>${p}</p><div class="opts">${o.map(x => `<i>${x}</i>`).join('')}</div><span class="go">Open ${ic('arrow')}</span></a>`).join('');
</script>
</body>
</html>
