<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round 20 Choices</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../r13/lab.css">
<style>
.band{background:radial-gradient(800px 260px at 85% -20%,rgba(52,211,153,.35),transparent 60%),linear-gradient(135deg,#03251C 0%,#064E3B 55%,#0B6B57 100%);color:#fff;padding:34px 20px 80px}
.band .bin{max-width:1080px;margin:0 auto}.band a{color:#C8EFDF;font-size:14px;font-weight:700;text-decoration:none}
.band h1{margin:12px 0 6px;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.band p{margin:0;font-size:17px;color:#C8EFDF;max-width:660px}
.wrap{max-width:1080px;margin:-52px auto 0;padding:0 20px 60px;display:grid;gap:18px}
.live{background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);padding:18px 20px;display:grid;gap:10px}
.live h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}.live h2 span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--gbg);color:var(--g);border-radius:999px;padding:4px 10px}
.live ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}.live li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px;color:var(--ink2)}.live li b{color:var(--ink)}
.live li svg{width:20px;height:20px;padding:3px;border-radius:50%;background:var(--g2);color:#fff;stroke-width:3}
.audit{background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);overflow:hidden}
.audit h2{margin:0;padding:16px 20px 12px;font-size:18px;font-weight:800;border-bottom:2px solid var(--ink)}
.ar{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,2fr);gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:14.5px}
.ar b{font-size:15px}.ar span{color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.c{display:grid;gap:10px;background:#fff;border-radius:18px;border:1px solid #E7EAF0;box-shadow:var(--shc);padding:18px 20px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;align-content:start}
.c:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.c .top{display:flex;align-items:center;gap:12px}.c .top span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#DDF5EC;color:#047857}.c .top span svg{width:24px;height:24px}
.c h3{margin:0;font-size:18px;font-weight:800;line-height:1.2}.c small{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.c p{margin:0;font-size:15px;color:var(--ink2)}.c .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--g);font-size:15px}
.c .opts{display:flex;flex-wrap:wrap;gap:6px}.c .opts i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--sf2);border-radius:999px;padding:3px 10px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:640px){ .band h1{font-size:28px} .band{padding:24px 16px 72px} .wrap{padding:0 12px 40px} .ar{grid-template-columns:minmax(0,1fr) auto;padding:12px 14px} .ar span:last-child{grid-column:1/-1} }
</style>
</head>
<body>
<div class="band"><div class="bin"><a href="../">‹ Design lab</a><h1>Round 20 · four things to look at</h1><p>Your full menu is back, with control over what staff see. Two designs to pick, and two ideas written out: staff handovers and Telegram.</p></div></div>
<div class="wrap">
  <div class="live"><h2>Already in the app <span>Live</span></h2><ul id="live"></ul></div>
  <div class="cards" id="cards"></div>
</div>
<script src="../r13/lab.js"></script>
<script>
$('live').innerHTML = [
  ['Signing in', ': your saved password belongs to your other app on the same web address, so the browser filled it into Nifti. Nifti has no account yet. The error now says that in plain words, with links to create an account or reset the password.'],
  ['Every page in your menu', ': as the owner you see all 21 pages in groups you can fold: Home, Orders, Messages, Stock; Money (all 8, from Money overview to Books); Selling & delivery; Checks, taxes & team. On a phone, a new Menu button at the bottom opens the same list.'],
  ['Who sees what', ': one panel (bottom of the menu, the Team page, or your account menu). Pick a role like Cashier or Driver, switch pages on or off, make your own roles, and tap "See Nifti as a Cashier" to check it. A bar at the bottom takes you back to your own view.'],
  ['Tabs in a coloured band', ': theme C on Orders, Money and Messages, with big pills. Staff only see the tabs their role allows.'],
  ['Orders in two columns', ': customers left, suppliers right, no switching buttons. Each column has its own "+ New order". On a phone they stack, with Customers and Suppliers jump buttons that stay at the top.'],
  ['Clean cards on Returns & credits', ': bold black labels on the left, values lined up on the right, no broken lines, buttons on their own row. Same on Getting paid, Checks, BIR 2307s and Price changes.'],
  ['A shorter landing page', ': from about 9,000 to 4,000 pixels tall. Hero, How it works, one "See it in action" showcase with 8 features you can click through, before and after, questions, and the button to try it. No Free or Pro badges.'],
  ['Orders badge fixed', ': it said 7 on Home and 2 on Orders. Now it\'s always the "Needs you now" number.']
].map(([b, t]) => `<li>${ic('check')}<span><b>${b}</b>${t}</span></li>`).join('');
$('cards').innerHTML = [
  ['sides.html', 'route', 'A clear line between customers and suppliers', '3 ways', 'Shown on Orders and on Returns & credits. Option B is live now so the pages stop looking messy.', ['A · A line down the middle', 'B · Two coloured sides (my pick, live)', 'C · A split bar on top']],
  ['band.html', 'tag', 'The coloured band in 4 colours', 'Colours', 'Green (live) and three more, next to the blue customer and teal supplier columns.', ['Green (my pick)', 'Slate', 'Ocean blue', 'Teal']],
  ['handover.html', 'file', 'When a key person leaves', 'Idea', 'Snap the old notebooks, hand over everything they held, and keep what they knew on each customer\'s page.', ['Notebook reader', 'Leaving checklist', 'Voice notes per customer']],
  ['telegram.html', 'msg', 'Nifti and Telegram: 10 ways', 'Ideas', 'Morning brief, one-tap approvals, payment proof matched, drivers, cash count, reorders, and more, each with a sample chat.', ['For the owner', 'For staff', 'For customers']]
].map(([h, i, t, n, p, o]) => `<a class="c" href="${h}"><div class="top"><span>${ic(i)}</span><div><small>${n}</small><h3>${t}</h3></div></div><p>${p}</p><div class="opts">${o.map(x => `<i>${x}</i>`).join('')}</div><span class="go">Open ${ic('arrow')}</span></a>`).join('');
</script>
</body>
</html>
