<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Colours</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../r13/lab.css">
<style>
.pgs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pgs small{font-size:12.5px;font-weight:800;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-right:2px}
.pgs button{min-height:38px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line2);font-size:13.5px;font-weight:700;color:var(--ink2)}
.pgs button[aria-pressed=true]{background:var(--ink2);color:#fff;box-shadow:none}
.lab-tab .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:640px;background:#fff}
.frame-p .app{grid-template-columns:minmax(0,1fr)}
.side{background:#FAFAFA;border-right:1px solid #E5E5E5;padding:14px 10px;display:grid;gap:1px;align-content:start}
.side .lg{font-weight:800;font-size:17px;padding:2px 10px 10px}
.side .h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#475467;padding:10px 10px 3px}
.side span{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:600;color:#344054}
.side span.on{background:#EBEBEB;color:#0E1114;font-weight:700}
.side span svg.i{width:15px;height:15px}
.frame-p .side{display:none}
.main{min-width:0;padding:16px 20px 24px;display:grid;gap:14px;align-content:start}
.frame-p .main{padding:12px 10px 20px}
/* the band, coloured by variables */
.bd{background:linear-gradient(180deg,var(--b1),var(--b2));border:1px solid var(--bl);border-radius:18px;padding:14px 16px;display:grid;gap:12px}
.bd .k{display:flex;align-items:center;gap:12px}
.bd .k span{width:38px;height:38px;border-radius:11px;background:var(--bi);color:#fff;display:grid;place-items:center}
.bd .k span svg.i{width:20px;height:20px}
.bd .k b{display:block;font-size:13.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bi)}
.bd .k small{display:block;font-size:13.5px;color:#344054;font-weight:600}
.bd .p{display:flex;gap:8px;flex-wrap:wrap}
.frame-p .bd .p{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.frame-p .bd .p::-webkit-scrollbar{display:none}
.bd .p button{flex:none;min-height:44px;padding:0 17px;border-radius:999px;background:#fff;border:1.5px solid var(--pl);font-size:15px;font-weight:700;color:#1D2939;white-space:nowrap}
.bd .p button.on{background:var(--bi);border-color:var(--bi);color:#fff}
.bd .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--bl);padding-top:10px}
.bd .sub em{font-style:normal;font-size:13.5px;font-weight:700;color:#475467;margin-right:4px}
.bd .sub button{min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid transparent;font-size:14px;font-weight:700;color:#344054;background:transparent}
.bd .sub button.on{background:#fff;border-color:var(--bi);color:var(--bi)}
.ph h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}.ph p{margin:2px 0 0;color:var(--ink2);font-size:14.5px}
.frame-p .ph h2{font-size:22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.frame-p .cols{grid-template-columns:1fr}
.cl{border-radius:16px;border:1px solid;border-top-width:5px;padding:12px;display:grid;gap:8px}
.cl.c{background:#F4F7FF;border-color:#D5E0FA;border-top-color:#1D4ED8}.cl.s{background:#F1FAF8;border-color:#C9E9E2;border-top-color:#0F766E}
.cl b.t{font-size:16px;font-weight:800}.cl.c b.t{color:#1D4ED8}.cl.s b.t{color:#0F766E}
.cl i{display:block;height:62px;border-radius:12px;background:#fff;border:1px solid #E3E7EC}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.frame-p .stats{grid-template-columns:1fr 1fr}
.stats i{display:block;height:58px;border-radius:12px;border:1px solid #E5E5E5;background:#fff}
.btnrow{display:flex;gap:8px;align-items:center}
.btnrow span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:10px;background:#1F6B45;color:#fff;font-weight:800;font-size:14px}
.btnrow small{font-size:13px;color:var(--mut)}
.all{display:grid;gap:10px;margin-top:4px}
.all .bd{padding:10px 14px}
.all h4{margin:6px 0 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
</style>
</head>
<body>
<header class="lab-top"><div class="lab-in">
  <div class="lab-r1"><a class="lab-back" href="index.html">‹ Round 20</a><h1>The coloured band: 4 colours</h1><p>Theme C is live in the app in green. Here it is in green and three other colours, on a page with the customer (blue) and supplier (teal) columns, so you can see how they sit together.</p></div>
  <div class="lab-tabs" id="tabs"></div>
  <div class="lab-r3" id="r3"></div>
</div></header>
<main class="lab-wrap" id="wrap"><section class="lab-stage" id="stage"></section><aside class="lab-notes" id="notes"></aside></main>
<div class="toast" id="toast"></div>
<script src="../r13/lab.js"></script>
<script>
const C = [
  {id: 'G', name: 'Green', tag: 'The brand colour. Live now', pick: 1, live: 1, sw: '#1F6B45', v: {bi: '#1F6B45', b1: '#EAF5EE', b2: '#F6FBF8', bl: '#D3EADB', pl: '#B7E0C7'},
    why: ['Same green as the main buttons and the Nifti logo, so the whole app feels like one thing.', 'It never clashes with the blue customer side or the teal supplier side.', 'The light tint is soft enough that the page under it still leads.'],
    give: 'Green also means "paid" and "all good", so a big green band is slightly less special.'},
  {id: 'S', name: 'Slate', tag: 'Calm grey-blue, very quiet', sw: '#3E5872', v: {bi: '#3E5872', b1: '#EEF2F6', b2: '#F7F9FB', bl: '#D8E0E8', pl: '#C3CFDB'},
    why: ['A calm grey-blue that reads as "this is the menu", not as a status.', 'Keeps every colour on the page for meaning: red is urgent, green is paid, blue and teal are the two sides.', 'Looks the most like a banking app: serious and neat.'],
    give: 'Quieter, so the tabs stand out less than in green or blue.'},
  {id: 'B', name: 'Ocean blue', tag: 'Bright and friendly', sw: '#1E5BB8', v: {bi: '#1E5BB8', b1: '#EAF1FC', b2: '#F6F9FE', bl: '#D2E0F6', pl: '#B4CBEF'},
    why: ['Blue is the colour most apps use for "you can tap this", so the pills look clickable straight away.', 'Bright and friendly, easy to spot from arm\'s length.'],
    give: 'Customers are blue too. On Orders and Getting paid the band and the customer side look related when they aren\'t.'},
  {id: 'T', name: 'Teal', tag: 'Fresh, between blue and green', sw: '#0E6E73', v: {bi: '#0E6E73', b1: '#E8F5F5', b2: '#F5FBFB', bl: '#CBE7E6', pl: '#A9D8D6'},
    why: ['Fresh and modern, and still close to the brand green.', 'Pairs nicely with the green buttons.'],
    give: 'Suppliers are teal. The band and the supplier side would look like they belong together.'}
];
const PG = {
  orders: {label: 'Orders', icon: 'truck', tabs: ['Orders', 'Follow-ups', 'Deliveries', 'Returns & credits', 'Online store', 'Find customers'], h: 'Orders', p: 'Customers on the left, suppliers on the right.', cols: 1},
  money: {label: 'Money', icon: 'wallet', tabs: ['Overview', 'Counter', 'Expenses', 'Getting paid', 'Prices', 'To check', 'Payroll', 'Books'], on: 3, sub: ['Who owes you', 'Checks', 'Cash & bank'], h: 'Money owed', p: 'Who owes you, and what you owe your suppliers.', cols: 1},
  messages: {label: 'Messages', icon: 'msg', tabs: ['Chats', 'Team'], h: 'Messages', p: 'Every customer and supplier chat in one place.'}
};
const SIDE = [['home', 'Home'], ['truck', 'Orders'], ['msg', 'Messages'], ['box', 'Stock'], ['h', 'Money'], ['chart', 'Money overview'], ['cash', 'Counter'], ['receipt', 'Expenses'], ['wallet', 'Getting paid'], ['tag', 'Prices'], ['bell', 'To check'], ['bank', 'Payroll'], ['file', 'Books'], ['h', 'Selling & delivery'], ['clock', 'Follow-ups'], ['route', 'Deliveries'], ['ret', 'Returns & credits']];
const S = {c: 'G', view: 'both', pg: 'orders', on: 0};
if(window.innerWidth < 700) S.view = 'p';
const vars = c => Object.entries(c.v).map(([k, v]) => `--${k}:${v}`).join(';');
function bandH(c, p, on){
  return `<div class="bd" style="${vars(c)}"><div class="k"><span>${ic(p.icon)}</span><div><b>${p.label}</b><small>${p.tabs.length} pages here</small></div></div>
    <div class="p">${p.tabs.map((t, k) => `<button class="${k === on ? 'on' : ''}" data-act="on" data-v="${k}">${t}</button>`).join('')}</div>
    ${p.sub && on === (p.on || 0) ? `<div class="sub"><em>In ${p.tabs[on]}:</em>${p.sub.map((t, k) => `<button class="${k === 0 ? 'on' : ''}">${t}</button>`).join('')}</div>` : ''}</div>`;
}
function page(){
  const c = C.find(x => x.id === S.c), p = PG[S.pg], on = S.on;
  const sideOn = S.pg === 'orders' ? 'Orders' : S.pg === 'messages' ? 'Messages' : ['Money overview', 'Counter', 'Expenses', 'Getting paid', 'Prices', 'To check', 'Payroll', 'Books'][on];
  return `<div class="app"><nav class="side"><div class="lg">Nifti</div>${SIDE.map(([i, l]) => i === 'h' ? `<div class="h">${l}</div>` : `<span class="${l === sideOn ? 'on' : ''}">${ic(i)}${l}</span>`).join('')}</nav>
    <div class="main">${bandH(c, p, on)}<div class="ph"><h2>${on === 0 ? p.h : p.tabs[on]}</h2><p>${p.p}</p></div>
      <div class="btnrow"><span>+ New order</span><small>a normal green button, next to the band colour</small></div>
      <div class="stats"><i></i><i></i><i></i><i></i></div>
      ${p.cols ? `<div class="cols"><div class="cl c"><b class="t">Selling to customers</b><i></i><i></i></div><div class="cl s"><b class="t">Buying from suppliers</b><i></i><i></i></div></div>` : '<div class="cols"><div class="cl c"><b class="t">Customers</b><i></i></div><div class="cl s"><b class="t">Suppliers</b><i></i></div></div>'}
    </div></div>`;
}
function render(){
  $('tabs').innerHTML = C.map(x => `<button class="lab-tab" aria-pressed="${S.c === x.id}" data-act="c" data-v="${x.id}"><i>${x.id}</i><b><span class="sw" style="background:${x.sw}"></span>${x.name}${x.pick ? ' · my pick' : ''}</b><small>${x.tag}</small></button>`).join('');
  $('r3').innerHTML = seg('vw', [['both', 'Laptop + phone'], ['d', 'Laptop'], ['p', 'Phone']], S.view, 'view') + `<div class="pgs"><small>Page</small>${[['orders', 'Orders'], ['money', 'Money'], ['messages', 'Messages']].map(([k, l]) => `<button aria-pressed="${S.pg === k}" data-act="pg" data-v="${k}">${l}</button>`).join('')}</div>`;
  $('wrap').classList.toggle('wide', S.view !== 'p');
  const pg = page();
  const desk = `<div class="frame-d">${pg}</div>`, phone = `<div class="frame-p"><div class="notch"><span>9:41</span><span>●●●</span></div><div class="scroll">${pg}</div></div>`;
  $('stage').innerHTML = S.view === 'd' ? desk : S.view === 'p' ? phone : `<div style="flex:1 1 720px;min-width:0;display:flex;justify-content:center">${desk}</div><div>${phone}</div>`;
  const x = C.find(v => v.id === S.c), p = PG[S.pg];
  $('notes').innerHTML = `<h2>${x.name}${x.pick ? ' <span class="pill green nodot" style="vertical-align:middle">My pick</span>' : ''}</h2><p style="margin:-8px 0 0;color:var(--mut);font-size:14px">${x.tag}</p>
    ${x.live ? '<div class="box" style="background:#E8F5EE"><b>Live in the app now</b> on Orders, Money and Messages.</div>' : ''}
    <h3>Why it works</h3><ul>${x.why.map(w => `<li>${ic('check')}<span>${w}</span></li>`).join('')}</ul>
    <div class="box"><b>You give up:</b> ${x.give}</div>
    <h3>All four, side by side</h3><div class="all">${C.map(c => `<h4>${c.name}</h4>${bandH(c, {label: p.label, icon: p.icon, tabs: p.tabs.slice(0, 3)}, 0)}`).join('')}</div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act, v = b.dataset.v;
  if(a === 'c') S.c = v; else if(a === 'view') S.view = v; else if(a === 'pg'){ S.pg = v; S.on = PG[v].on || 0; } else if(a === 'on') S.on = Number(v);
  render(); });
render();
</script>
</body>
</html>
