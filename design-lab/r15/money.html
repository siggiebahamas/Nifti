<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Backgrounds</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="../r13/lab.css">
<style>
/* ---------- 5 one-palette backgrounds: page, side, card, hairline, ink and one accent from the same family ---------- */
.pal-ivory{--bg:#FAF9F5;--side:#F2F0E8;--card:#FFFFFF;--hl:#E6E3D9;--ink:#1C1B18;--ink2:#4A4943;--mut:#7A786F;--acc:#2F6B4F;--acci:#FFFFFF;--soft:#E6EFE8;--barS:#E4E1D7;--barN:#2F6B4F;--hov:#ECEAE1}
.pal-pearl{--bg:#FDFDFC;--side:#F5F5F3;--card:#FFFFFF;--hl:#E8E8E5;--ink:#111113;--ink2:#46464B;--mut:#77777E;--acc:#1F6B45;--acci:#FFFFFF;--soft:#E8F3EC;--barS:#E9E9E6;--barN:#1F6B45;--hov:#EFEFEC}
.pal-stone{--bg:#F3F3F1;--side:#E9E9E6;--card:#FBFBFA;--hl:#DCDCD7;--ink:#18181B;--ink2:#45454B;--mut:#73737A;--acc:#3F3F46;--acci:#FFFFFF;--soft:#E4E4E7;--barS:#DCDCD8;--barN:#3F3F46;--hov:#E1E1DD}
.pal-sage{--bg:#F2F4EF;--side:#E7EBE2;--card:#FFFFFF;--hl:#DBE1D4;--ink:#1A211C;--ink2:#435047;--mut:#6E7A71;--acc:#3D5E4A;--acci:#FFFFFF;--soft:#E1EADF;--barS:#DCE3D6;--barN:#3D5E4A;--hov:#E0E5DA}
.pal-mist{--bg:#F3F5F8;--side:#E8ECF1;--card:#FFFFFF;--hl:#DCE2EA;--ink:#121826;--ink2:#3E4757;--mut:#6B7484;--acc:#3B6188;--acci:#FFFFFF;--soft:#E3EAF3;--barS:#DCE3EC;--barN:#3B6188;--hov:#E1E6EE}
.pal-ivory,.pal-pearl,.pal-stone,.pal-sage,.pal-mist{--line:var(--hl);--sf2:var(--bg);--g:var(--acc);
  --redt:#B42318;--redb:#FBEDEB;--yelt:#7A5B00;--yelb:#FBF3D9;--grnt:#2B6A47;--grnb:#E7F2EA;--blut:#2E5A88;--blub:#E7EEF7}
.hd{font-family:"Newsreader",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.sans .hd{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);height:860px;background:var(--bg);color:var(--ink)}
.frame-p .shell{display:flex;flex-direction:column;height:auto;flex:1;min-height:0}
.nav{background:var(--side);border-right:1px solid var(--hl);overflow-y:auto;padding:16px 10px;scrollbar-width:thin}
.nav .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;padding:0 10px 12px}
.nav .brand i,.mbar .mt i{width:28px;height:28px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--acci);font-style:normal;font-size:14px}
.nav h6{margin:12px 10px 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.nav button svg.i{width:17px;height:17px;color:var(--mut)}
.nav button:hover{background:var(--hov)}.nav button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 0 0 1px var(--hl)}.nav button.on svg.i{color:var(--acc)}
.frame-p .nav{display:none}
.mbar{display:none}
.frame-p .mbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--side);border-bottom:1px solid var(--hl);flex:none}
.mbar .mt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.main{overflow-y:auto;min-height:0;scrollbar-width:thin}
.frame-p .main{flex:1}
.frame-p .notch{background:var(--side);color:var(--ink)}
/* ---------- Horizon, quiet ---------- */
.hz-band{background:var(--side);padding:30px 34px 78px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--hl)}
.hz-k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hz-band h1{margin:0;font-size:40px;line-height:1.05;color:var(--ink)}.hz-band p{margin:8px 0 0;font-size:15.5px;color:var(--ink2);max-width:560px}
.hz-acts{display:flex;gap:8px;flex-wrap:wrap}
.hz-acts button{min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hl);font-size:14.5px;font-weight:700}
.hz-acts button.pri{background:var(--acc);color:var(--acci);box-shadow:none}
.hz-body{margin-top:-52px;padding:0 34px 40px;display:grid;gap:16px}
.hz-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hz-st{background:var(--card);border-radius:16px;border:1px solid var(--hl);box-shadow:0 1px 2px rgba(20,20,10,.03),0 12px 28px -22px rgba(20,20,10,.35);padding:15px 17px}
.hz-st small{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.hz-st small i{width:8px;height:8px;border-radius:50%}
.hz-st b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}.hz-st span{font-size:13.5px;color:var(--mut)}
.ans{background:var(--card);border-radius:16px;border:1px solid var(--hl);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ans .q{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);flex-basis:100%;margin-bottom:-8px}
.ans .a{font-size:30px;line-height:1.15;color:var(--ink);flex:1;min-width:240px}.ans .a b{color:var(--acc);font-weight:inherit}
.ans .d{font-size:14px;font-weight:700;color:var(--redt);background:var(--redb);border-radius:999px;padding:6px 12px;white-space:nowrap}
.card{background:var(--card);border-radius:16px;border:1px solid var(--hl);overflow:hidden}
.ch{padding:16px 20px 12px;border-bottom:1px solid var(--hl);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ch h3{margin:0;font-size:22px;line-height:1.2;color:var(--ink)}.ch p{margin:0;font-size:14px;color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
/* how it added up */
.mth{padding:6px 20px 14px}
.mr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:15.5px;color:var(--ink2);border-top:1px solid var(--hl)}
.mr:first-child{border-top:0}
.mr b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}.mr b.neg{color:var(--ink2)}
.mr.sub{font-weight:700;color:var(--ink)}
.mr.tot{border-top:2px solid var(--ink);font-weight:800;color:var(--ink);font-size:17px}.mr.tot b{color:var(--acc);font-size:19px;font-weight:800;border-bottom:3px double var(--acc)}
/* where the money went */
.bars{padding:12px 20px 18px;display:grid;gap:12px}
.br{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14.5px}
.br span{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.br span small{display:block;font-size:12.5px;font-weight:700;color:var(--redt)}
.br i{height:12px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--hl);overflow:hidden;display:block}.br i u{display:block;height:100%;border-radius:999px;background:var(--acc);opacity:.85}
.br i u.red{background:#D9534F;opacity:1}
.br b{text-align:right;font-variant-numeric:tabular-nums}
/* chart */
.chw{padding:8px 20px 18px}
.chw svg{width:100%;height:auto;display:block}
.chw .cp{display:none}
.cv{font-size:12px;font-weight:800;fill:var(--ink2)}.cv.now{fill:var(--acc)}
.cm{font-size:12.5px;font-weight:700;fill:var(--mut)}.cm.now{fill:var(--ink);font-weight:800}
.cpv{font-size:12px;font-weight:800}.cpv.g{fill:#2B6A47}.cpv.l{fill:#B42318}
.cl{font-size:15px;font-weight:800;fill:var(--ink)}.cl2{font-size:12.5px;font-weight:600;fill:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:700;color:var(--ink2);padding:12px 20px 0}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* what needs you */
.hz-g{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--bg);border-top:1px solid var(--hl)}
.hz-g b{font-size:14px;letter-spacing:0;color:var(--ink)}
.hz-g:first-of-type{border-top:0}
.rw{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:13px 20px;border-top:1px solid var(--hl)}
.rw .tt{font-size:15.5px;font-weight:800;line-height:1.3;color:var(--ink)}.rw .ss{font-size:14px;color:var(--mut);margin-top:1px}
.rw .am{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:90px}
.rw .am.inc{color:#2B6A47}
.rw .bt{min-width:104px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--hl);font-size:14.5px;font-weight:800}
.rw .bt:hover{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.rw .bt.pri{background:var(--acc);color:var(--acci);box-shadow:none}
.dt{background:var(--bg);box-shadow:inset 0 0 0 1px var(--hl);color:var(--ink)}
.dt.red{background:var(--redb);color:var(--redt);box-shadow:none}.dt.yel{background:var(--yelb);color:var(--yelt);box-shadow:none}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hl)}
.pl::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pl.blue{background:var(--blub);color:var(--blut);box-shadow:none}.pl.yel{background:var(--yelb);color:var(--yelt);box-shadow:none}.pl.red{background:var(--redb);color:var(--redt);box-shadow:none}.pl.green{background:var(--grnb);color:var(--grnt);box-shadow:none}
/* compare */
.cmp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;width:100%}
.cmp > div{display:grid;gap:8px}
.mini{border-radius:16px;overflow:hidden;box-shadow:var(--sh2);background:var(--bg);cursor:pointer;color:var(--ink);border:1px solid var(--hl)}
.mini .mb{background:var(--side);padding:16px 14px 40px;border-bottom:1px solid var(--hl)}
.mini .mb small{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.mini .mb b{display:block;font-size:22px;margin-top:2px}
.mini .m2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-28px 12px 10px}
.mini .m2 div{background:var(--card);border:1px solid var(--hl);border-radius:12px;padding:9px 10px}.mini .m2 small{display:block;font-size:10.5px;font-weight:700;color:var(--ink2)}.mini .m2 b{font-size:16px}
.mini .m3{margin:0 12px 12px;background:var(--card);border:1px solid var(--hl);border-radius:12px;padding:12px}
.mini .m3 .hd{font-size:17px;line-height:1.2}.mini .m3 .hd b{color:var(--acc);font-weight:inherit}
.mini .m4{margin:0 12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
.mini .m4 span:last-child{background:var(--acc);color:var(--acci);border-radius:999px;padding:6px 12px;font-weight:800}
.cmp .cap{font-size:14px;font-weight:800;text-align:center}.cmp .cap small{display:block;font-weight:600;color:var(--mut);font-size:12.5px}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sws span{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--mut);font-weight:700}
.sws i{width:40px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
@container scr (max-width:1000px){ .hz-stats{grid-template-columns:repeat(2,minmax(0,1fr))} .two{grid-template-columns:minmax(0,1fr)} }
@container scr (max-width:640px){
  .hz-band{padding:20px 16px 64px}.hz-band h1{font-size:31px}.hz-band p{font-size:14.5px}
  .hz-acts{width:100%}.hz-acts button{flex:1}
  .hz-body{padding:0 12px 26px;margin-top:-48px;gap:12px}
  .hz-stats{gap:8px}.hz-st{padding:12px}.hz-st b{font-size:22px}.hz-st small{font-size:12px}
  .ans{padding:16px;gap:10px}.ans .q{margin-bottom:0}.ans .a{font-size:26px;min-width:0;flex-basis:100%}
  .ch{padding:14px 16px 10px}.ch h3{font-size:20px}
  .mth{padding:4px 16px 12px}.bars{padding:12px 16px 16px}
  .br{grid-template-columns:minmax(0,1fr) 86px;row-gap:5px}.br i{grid-column:1/-1;grid-row:2}
  .chw{padding:6px 12px 14px}.chw .cd{display:none}.chw .cp{display:block}.leg{padding:12px 16px 0}
  .hz-g{padding:10px 16px}
  .rw{grid-template-columns:auto minmax(0,1fr) auto;row-gap:8px;padding:13px 16px}
  .rw > .pl{grid-column:2;justify-self:start;grid-row:2}.rw .am{grid-row:1;grid-column:3}.rw .bt{grid-column:1/-1;grid-row:3;width:100%}.rw .dt{grid-row:1/3}
}
@media (max-width:1100px){ .cmp{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:700px){ .shell{grid-template-columns:minmax(0,1fr);height:auto} .frame-d .nav{display:none} .frame-p .main{overflow:visible} .frame-p .shell{display:block} .cmp{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<header class="lab-top"><div class="lab-in">
  <div class="lab-r1"><a class="lab-back" href="index.html">‹ Round 15</a><h1>Money overview · 5 quiet backgrounds</h1><p>One soft background and one accent each, like Claude's calm off-white. Same page and layout in all five, so only the colour changes.</p></div>
  <div class="lab-tabs" id="tabs"></div>
  <div class="lab-r3" id="r3"></div>
</div></header>
<main class="lab-wrap wide" id="wrap"><section class="lab-stage" id="stage"></section><aside class="lab-notes" id="notes"></aside></main>
<div class="toast" id="toast"></div>
<script src="../r13/lab.js"></script>
<script src="../r13/money-data.js"></script>
<script>
const PAL = [
  {id: 'ivory', n: '1', name: 'Ivory', tag: 'Warm off-white, closest to Claude', sw: ['#FAF9F5', '#F2F0E8', '#1C1B18', '#2F6B4F'], why: ['The warm, paper-like off-white of Claude, with a slightly deeper side menu.', 'Near-black text and one deep green for the buttons that matter.', 'Feels calm and friendly, never clinical.'], best: 'The Claude look: warm, quiet and easy on older eyes.'},
  {id: 'pearl', n: '2', name: 'Pearl', tag: 'Almost white, Nifti green', sw: ['#FDFDFC', '#F5F5F3', '#111113', '#1F6B45'], why: ['The brightest of the five: nearly white with fine gray lines.', 'Nifti\'s own green is the only colour, so it always means "tap here".', 'Crisp, like a premium phone settings screen.'], best: 'Owners who like bright, clean screens.'},
  {id: 'stone', n: '3', name: 'Stone', tag: 'Soft neutral gray, graphite buttons', sw: ['#F3F3F1', '#E9E9E6', '#18181B', '#3F3F46'], why: ['A soft, neutral gray page with off-white cards that float on it.', 'Graphite buttons: no colour at all except red, yellow and green for status.', 'The most "serious tool" feel, like a pro finance app.'], best: 'A strict, no-colour look where only warnings stand out.'},
  {id: 'sage', n: '4', name: 'Sage', tag: 'Pale green-gray, deep sage', sw: ['#F2F4EF', '#E7EBE2', '#1A211C', '#3D5E4A'], why: ['A very pale green-gray, like linen in daylight.', 'Deep sage buttons tie in with Nifti green without shouting.', 'Restful for long days on the books.'], best: 'A natural, softer take on Nifti green.'},
  {id: 'mist', n: '5', name: 'Mist', tag: 'Cool blue-gray, steel blue', sw: ['#F3F5F8', '#E8ECF1', '#121826', '#3B6188'], why: ['A cool, airy blue-gray page: fresh and modern.', 'Steel-blue buttons, lighter than navy, with no gold anywhere.', 'Numbers in near-black read very sharply on it.'], best: 'A cool, tech-company feel.'}
];
const S = {p: 'ivory', view: 'both', font: 'serif', done: {}};
if(window.innerWidth < 700) S.view = 'p';
const P = PG.money;
const MONTHS = [['Mar', 247000, 10000], ['Apr', 226000, 6000], ['May', 282000, -28000], ['Jun', 264000, 11000], ['Jul', 322000, 34000], ['Aug', 263208, 18670]];
const tone = {green: '#2B6A47', blue: '#2E5A88', gray: '#98A2B3', red: '#B42318', yel: '#C9A227'};
const sh = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return s + '₱' + (a >= 1000 ? Math.round(a / 1000) + 'K' : a); };
function chart(ph){
  const W = ph ? 340 : 720, labW = ph ? 0 : 120, padX = ph ? 4 : 12, x0 = labW + padX, x1 = W - padX, cap = ph ? 28 : 0, top = 26 + cap, sH = ph ? 104 : 120, n = MONTHS.length, bw = (x1 - x0) / n, barW = Math.min(46, bw * (ph ? .62 : .5));
  const maxS = Math.max(...MONTHS.map(m => m[1])), maxP = Math.max(...MONTHS.map(m => Math.abs(m[2]))), avg = MONTHS.reduce((a, m) => a + m[1], 0) / n;
  const lblY = top + sH + 22, plTop = lblY + 22 + (ph ? 30 : 0), plH = 84, z = plTop + plH / 2, H = plTop + plH + 16, ay = top + sH - avg / maxS * sH;
  let s = `<svg class="${ph ? 'cp' : 'cd'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales and profit or loss, last 6 months">`;
  if(ph) s += `<text x="${padX}" y="18" class="cl">Sales <tspan class="cl2" dx="4">each month</tspan></text><text x="${padX}" y="${lblY + 36}" class="cl">Profit / Loss <tspan class="cl2" dx="4">after all costs</tspan></text>`;
  else { const sy = top + sH / 2; s += `<text x="0" y="${sy - 2}" class="cl">Sales</text><text x="0" y="${sy + 16}" class="cl2">each month</text><text x="0" y="${z - 2}" class="cl">Profit / Loss</text><text x="0" y="${z + 16}" class="cl2">after all costs</text>`;
    s += `<line x1="${labW - 8}" x2="${labW - 8}" y1="${top - 8}" y2="${top + sH}" style="stroke:var(--hl)"/><line x1="${labW - 8}" x2="${labW - 8}" y1="${plTop}" y2="${plTop + plH}" style="stroke:var(--hl)"/>`; }
  s += `<line x1="${x0}" x2="${x1}" y1="${top + sH}" y2="${top + sH}" style="stroke:var(--hl)"/><line x1="${x0}" x2="${x1}" y1="${ay}" y2="${ay}" style="stroke:var(--mut)" stroke-dasharray="4 4" opacity=".6"/><line x1="${x0}" x2="${x1}" y1="${z}" y2="${z}" style="stroke:var(--hl)"/>`;
  MONTHS.forEach(([lab, sales, pr], i) => { const cx = x0 + bw * (i + .5), h = sales / maxS * sH, now = i === n - 1, bh = Math.max(3, Math.abs(pr) / maxP * (plH / 2 - 6)), loss = pr < 0, pw = barW * .7;
    s += `<rect x="${cx - barW / 2}" y="${top + sH - h}" width="${barW}" height="${h}" rx="7" style="fill:${now ? 'var(--barN)' : 'var(--barS)'}"/><text x="${cx}" y="${top + sH - h - 7}" text-anchor="middle" class="cv${now ? ' now' : ''}">${sh(sales)}</text>`;
    s += `<text x="${cx}" y="${lblY}" text-anchor="middle" class="cm${now ? ' now' : ''}">${lab}${now && !ph ? ' (so far)' : ''}</text>`;
    s += `<rect x="${cx - pw / 2}" y="${loss ? z : z - bh}" width="${pw}" height="${bh}" rx="4" fill="${loss ? '#D9534F' : '#3C8A5F'}"/><text x="${cx}" y="${loss ? z + bh + 13 : z - bh - 5}" text-anchor="middle" class="cpv ${loss ? 'l' : 'g'}">${loss ? '' : '+'}${sh(pr)}</text>`; });
  return s + '</svg>';
}
const k = (g, i) => 'g' + g + '.' + i;
function page(){
  const b = P.bars, mx = Math.max(...b.rows.map(r => r[1]));
  return `<div class="hz-band"><div><div class="hz-k">Dela Cruz Hardware · Wed, Aug 26</div><h1 class="hd">${P.t}</h1><p>${P.s}</p></div><div class="hz-acts"><button data-act="toast" data-v="Pick a month (prototype)">August 2026</button><button class="pri" data-act="toast" data-v="Downloads the report (prototype)">Download</button></div></div>
  <div class="hz-body"><div class="hz-stats">${P.stats.map(s => `<div class="hz-st"><small><i style="background:${tone[s[0]]}"></i>${s[1]}</small><b>${s[2]}</b><span>${s[3]}</span></div>`).join('')}</div>
    <div class="ans"><span class="q">${P.q}</span><div class="a hd">Yes. You kept <b>₱18,670</b> after every cost.</div><span class="d">${P.delta[1]}</span></div>
    <div class="two"><div class="card"><div class="ch"><h3 class="hd">How August added up</h3><p>Top to bottom</p></div><div class="mth">${P.math.map(([l, v, t]) => `<div class="mr ${t || ''}"><span>${l}</span><b class="${v < 0 ? 'neg' : ''}">${v < 0 ? '−' + peso(-v) : peso(v)}</b></div>`).join('')}</div></div>
      <div class="card"><div class="ch"><h3 class="hd">${b.h}</h3><p>${b.s}</p></div><div class="bars">${b.rows.map(r => `<div class="br"><span>${r[0]}${r[3] ? `<small>${r[3]}</small>` : ''}</span><i><u class="${r[2] === 'red' ? 'red' : ''}" style="width:${Math.max(2, r[1] / mx * 100)}%"></u></i><b>${peso(r[1])}</b></div>`).join('')}</div></div></div>
    <div class="card"><div class="ch"><h3 class="hd">How the business is doing</h3><p>Last 6 months</p></div><div class="leg"><span><i style="background:var(--barS);box-shadow:inset 0 0 0 1px var(--hl)"></i>Sales</span><span><i style="background:var(--barN)"></i>This month</span><span><i style="background:#3C8A5F"></i>Profit</span><span><i style="background:#D9534F"></i>Loss</span></div><div class="chw">${chart(false)}${chart(true)}</div></div>
    <div class="card"><div class="ch"><h3 class="hd">What needs you</h3><p>Most urgent on top</p></div>${P.groups.map((g, gi) => `<div class="hz-g">${g[1]}<b>${g[2]}</b></div>${g[3].map((r, i) => { const dn = S.done[k(gi, i)], m = r[0].match(/^([A-Z]{3}) (\d+)$/);
      return `<div class="rw"${dn ? ' style="opacity:.55"' : ''}><span class="dt ${g[0] === 'yel' ? 'yel' : ''}"><small>${m[1]}</small><b>${m[2]}</b></span><div><div class="tt">${r[1]}</div><div class="ss">${r[2]}</div></div><span class="pl ${r[3][0]}">${r[3][1]}</span><span class="am${r[4] > 0 ? ' inc' : ''}">${r[4] > 0 ? '+' + peso(r[4]) : '−' + peso(-r[4])}</span><button class="bt${i === 0 && gi === 0 ? ' pri' : ''}" data-act="do" data-k="${k(gi, i)}" data-v="${r[5]}">${dn ? 'Done' : r[5]}</button></div>`; }).join('')}`).join('')}</div></div>`;
}
function shell(inner){
  const nav = `<nav class="nav"><div class="brand"><i>N</i>Nifti</div>${NAV.map(([h, items]) => `${h ? `<h6>${h}</h6>` : '<div style="height:10px"></div>'}${items.map(([id, l, i]) => `<button class="${id === 'money' ? 'on' : ''}" data-act="toast" data-v="Only Money overview is in this sample">${ic(i)}${l}</button>`).join('')}`).join('')}</nav>`;
  return `<div class="shell">${nav}<div class="mbar"><span class="mt"><i>N</i>Money overview</span>${ic('dots')}</div><div class="main">${inner}</div></div>`;
}
function compare(){
  return `<div class="cmp">${PAL.map(x => `<div><div class="mini pal-${x.id}${S.font === 'sans' ? ' sans' : ''}" data-act="p" data-v="${x.id}"><div class="mb"><small>Money overview</small><b class="hd">August 2026</b></div><div class="m2"><div><small>Profit</small><b>₱18,670</b></div><div><small>Owed to you</small><b>₱23,804</b></div></div><div class="m3"><div class="hd">Yes. You kept <b>₱18,670</b> after every cost.</div></div><div class="m4"><span>Riverside promised to pay</span><span>Remind</span></div></div><div class="cap">${x.n} · ${x.name}<small>${x.tag}</small></div></div>`).join('')}</div>`;
}
function render(){
  const keep = [...document.querySelectorAll('.main')].map(e => e.scrollTop);
  $('tabs').innerHTML = PAL.map(x => `<button class="lab-tab" aria-pressed="${S.p === x.id && S.view !== 'all'}" data-act="p" data-v="${x.id}"><i style="background:linear-gradient(135deg,${x.sw[0]} 0 50%,${x.sw[3]} 50%);color:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)">${x.n}</i><b>${x.name}</b><small>${x.tag}</small></button>`).join('');
  $('r3').innerHTML = seg('vw', [['both', 'Laptop + phone'], ['d', 'Laptop'], ['p', 'Phone'], ['all', 'All 5 at a glance']], S.view, 'view') + seg('fn', [['serif', 'Titles: serif, like Claude'], ['sans', 'Titles: plain']], S.font, 'font');
  $('notes').style.display = S.view === 'all' ? 'none' : '';
  const fc = S.font === 'sans' ? ' sans' : '';
  if(S.view === 'all') $('stage').innerHTML = compare();
  else { const inner = page(), cls = 'pal-' + S.p + fc;
    const desk = `<div class="frame-d ${cls}">${shell(inner)}</div>`, phone = `<div class="frame-p ${cls}"><div class="notch"><span>9:41</span><span>●●●</span></div>${shell(inner)}</div>`;
    $('stage').innerHTML = S.view === 'd' ? desk : S.view === 'p' ? phone : `<div style="flex:1 1 760px;min-width:0;display:flex;justify-content:center">${desk}</div><div>${phone}</div>`; }
  const x = PAL.find(p => p.id === S.p);
  $('notes').innerHTML = `<h2>${x.n} · ${x.name}</h2><p class="tg">${x.tag}</p><div class="sws">${x.sw.map((c, i) => `<span><i style="background:${c}"></i>${['Page', 'Side', 'Text', 'Buttons'][i]}</span>`).join('')}</div><h3>Why it works</h3><ul>${x.why.map(w => `<li>${ic('check')}<span>${w}</span></li>`).join('')}</ul><div class="box"><b>Best for:</b> ${x.best}</div>
    <div class="box"><b>Same in all 5:</b> red, yellow and green still mean late, soon and done. The "How the business is doing" chart from Home is added here so you can see it, with the new <b>Sales</b> and <b>Profit / Loss</b> labels, in each colour.</div>`;
  if(S.keep) document.querySelectorAll('.main').forEach((e, i) => { e.scrollTop = keep[i] || 0; }); S.keep = false;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act, v = b.dataset.v;
  if(a === 'p'){ S.p = v; if(S.view === 'all') S.view = 'both'; } else if(a === 'view') S.view = v; else if(a === 'font'){ S.font = v; S.keep = true; }
  else if(a === 'do'){ S.done[b.dataset.k] = !S.done[b.dataset.k]; S.keep = true; toast(v + ' (prototype)'); }
  else if(a === 'toast') return toast(v);
  render(); });
render();
</script>
</body>
</html>
