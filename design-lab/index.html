<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nifti Design Lab</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#111827;--ink2:#4B5563;--line:#E5E7EB;--bg:#EEF0F3;--acc:#1F4FD1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) 8px;display:grid;gap:8px;position:relative;z-index:5}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.top p{margin:0;color:var(--ink2);font-size:12.5px;flex:1;min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink2);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lnk{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;min-height:34px}
.lnk[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.themes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.th{flex:none;width:190px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;text-align:left;display:grid;gap:3px;position:relative}
.th:hover{border-color:#9CA3AF}
.th.a{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.th.b{border-color:#C2410C;box-shadow:0 0 0 2px #C2410C inset}
.th .tag{position:absolute;right:8px;top:7px;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff}
.th.a .tag{background:var(--ink)} .th.b .tag{background:#C2410C}
.th b{font-size:13.5px;display:block;padding-right:26px} .th b span{color:#9CA3AF;font-weight:600;margin-right:4px}
.th small{font-size:11.5px;color:var(--ink2);line-height:1.3;height:30px;overflow:hidden;display:block}
.th em{font-style:normal;font-size:11px;color:#6B7280}
.sw{display:flex;gap:3px;margin-top:2px}.sw i{width:22px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-weight:600;font-size:12.5px;color:var(--ink2);min-height:30px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button span{opacity:.55;margin-right:4px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--ink2)}
main{flex:1;min-height:0;display:flex;gap:12px;justify-content:center;padding:12px;overflow:auto}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pane .cap{font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.pane .cap i{font-style:normal;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.frame{flex:1;width:100%;min-height:500px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 20px 50px -30px rgba(17,24,39,.35)}
.phone .pane{flex:none;width:400px;max-width:100%}
.phone .frame{border-radius:28px;border:8px solid #111827}
iframe{width:100%;height:100%;border:0;display:block}
#paneB{display:none} .cmp #paneB{display:flex}
.about{display:none;background:#fff;border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-left));max-height:46vh;overflow:auto}
.about.on{display:grid;gap:14px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.about h2{font-size:14px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.about p, .about li{font-size:13px;color:#374151;margin:0 0 4px}
.about ul{margin:0;padding-left:18px}
.qc{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.qc b{color:#047857}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.note.on{opacity:1}
@media (max-width:760px){ .top p{display:none} .th{width:160px} main{padding:6px} .about.on{grid-template-columns:1fr} .cmp #paneB{display:none} }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Nifti · Design lab</h1><p>Your real dashboard with demo data, in 10 visual themes. Same features, pages, numbers and buttons; only the visual design changes. Page colour now clearly differs from tables. Click inside to use it.</p>
    <div class="seg" role="group" aria-label="Screen size"><button type="button" data-dev="desk">Desktop</button><button type="button" data-dev="phone">Phone</button></div>
    <div class="seg" role="group" aria-label="Compare"><button type="button" data-cmp="0">One theme</button><button type="button" data-cmp="1">Compare two</button></div>
    <button type="button" class="lnk" id="btnAbout" aria-expanded="false">About this theme</button></div>
  <div class="themes" id="themes" role="group" aria-label="Themes"></div>
  <div class="tabs" id="tabs" role="group" aria-label="Pages"></div>
  <div class="hint" id="hint"></div>
</header>
<section class="about" id="about" aria-live="polite"></section>
<main id="main">
  <div class="pane" id="paneA"><div class="cap" id="capA"></div><div class="frame"><iframe id="appA" title="Nifti, theme A" src="../"></iframe></div></div>
  <div class="pane" id="paneB"><div class="cap" id="capB"></div><div class="frame"><iframe id="appB" title="Nifti, theme B" src="about:blank"></iframe></div></div>
</main>
<div class="note" id="note"></div>
<script>
const THEMES = [
  ['cur','Current','How it looks today','', 'IBM Plex Sans', ['#F6F4EF','#1F6B45','#15201A','#FFFFFF'], null],
  ['evergreen','Evergreen','Closest to today: sage page, white tables, deep green','t01-evergreen','Instrument Serif + Instrument Sans', ['#DFE8E2','#17663F','#FFFFFF','#E6F0EA'],
    'Your current look, refined. A clear sage page colour so every white table and card stands out, deep green actions, elegant serif page titles and a clean modern sans for everything else.'],
  ['harbor','Harbor Slate','Navy menu, slate-blue page, yellow for what needs you','t02-harbor','Onest', ['#13294A','#DCE4EE','#1C4E8F','#F2B705'],
    'Confident and easy to scan. A navy menu, slate-blue page colour behind white tables, navy actions and a sun-yellow marker on anything that needs you.'],
  ['celadon','Celadon','Soft teal page, teal actions, rounded and friendly','t03-celadon','Manrope', ['#D7E8E5','#0B6E69','#FFFFFF','#E2F1EF'],
    'Calm and fresh. A soft teal-green page colour, teal pill buttons and a filled teal menu highlight. Rounder corners, friendly but grown-up.'],
  ['pewter','Pewter Emerald','Cool gray page, black menu highlight, emerald actions','t04-pewter','Geist + Geist Mono', ['#E1E4E8','#0F1317','#0B7A52','#FFFFFF'],
    'Crisp and precise. Cool pewter page colour, a black highlight in the menu, emerald actions, uppercase table headers and a coloured left edge on each summary tile.'],
  ['coastline','Coastline Deep','The Coastline you liked, with a deeper page colour','t05-coastline','Figtree', ['#D5E5EC','#0E7490','#2F55C4','#E78B00'],
    'The most colour-coded. Every summary number takes the colour of its meaning (teal sales, cobalt costs, green profit, amber cash, red money owed to you), on a deeper aqua page colour.'],
  ['ivory','Ivory Forest','Warm stone page, forest green, serif numbers','t06-ivory','Fraunces + Hanken Grotesk', ['#E7E6E1','#1F5E3B','#FFFFFF','#EEF3EF'],
    'Classic and premium. A warm stone page colour (no brown), forest-green actions, serif section titles and serif figures, like a well-made ledger.'],
  ['indigo','Indigo Mist','Lavender-gray page, indigo actions, tiles marked on top','t07-indigo','Sora + Albert Sans', ['#E0E4F2','#3346A6','#FFFFFF','#ECEEFA'],
    'Modern and composed. A cool lavender-gray page colour, indigo actions and a filled indigo menu highlight. Each summary tile carries its colour along the top.'],
  ['skyroyal','Sky Royal','Bright sky page, royal blue, characterful titles','t08-skyroyal','Bricolage Grotesque + Instrument Sans', ['#D9E6F5','#1D5BD6','#FFFFFF','#E8F0FD'],
    'Bright and energetic. A clear sky-blue page colour, royal-blue pill buttons and distinctive Bricolage titles with a clean sans for the details.'],
  ['jade','Jade Fresh','Mint page, jade actions, solid coloured tile icons','t09-jade','Plus Jakarta Sans', ['#DBEDE4','#12805C','#FFFFFF','#E4F4EC'],
    'Fresh and friendly. A mint page colour, jade pill buttons and a filled jade menu highlight. Summary tile icons are solid colour blocks, the boldest coding of the ten.'],
  ['lagoon','Lagoon','Deep teal menu, cool page, mint highlights','t10-lagoon','Be Vietnam Pro', ['#0F3B42','#DDE8E9','#0F7C6B','#5FD3B8'],
    'Rich but light. A deep teal menu beside a cool, light page colour, teal actions and mint highlights. The menu frames the work without darkening it.']
];
const TABS = [['dashboard','Home'],['orders','Orders'],['messages','Messages'],['suppliers','Customers & suppliers'],['inventory','Stock'],['money','Money overview'],['sales','Sales'],['expenses','Expenses'],['cashcount','Cash count'],['collections','Who owes you'],['profit','Profit & prices'],['issues','To check'],['ledger','Books & reports'],['bank','Bank & deposits'],['payroll','Payroll'],['close','Month-end close'],['store','Online store'],['prices','Price list'],['followups','Follow-ups'],['watchdog',"Owner's watchdog"],['team','Team'],['settings','Settings'],['history','Edit history']];
const $ = s => document.querySelector(s);
const st = Object.assign({a:'evergreen', b:'coastline', tab:'dashboard', dev:'desk', cmp:'0'}, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
const F = {A:{el:$('#appA'), ready:false}, B:{el:$('#appB'), ready:false}};
$('#themes').innerHTML = THEMES.map((t,i) => `<button type="button" class="th" data-th="${t[0]}"><span class="tag"></span><b><span>${i ? String(i).padStart(2,'0') : '—'}</span>${t[1]}</b><small>${t[2]}</small><em>${t[4]}</em><span class="sw">${t[5].map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`).join('');
$('#tabs').innerHTML = TABS.map((t,i) => `<button type="button" data-tab="${t[0]}"><span>${i + 1}</span>${t[1]}</button>`).join('');
function note(m){ const n = $('#note'); n.textContent = m; n.classList.add('on'); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove('on'), 1600); }
const T = id => THEMES.find(x => x[0] === id) || THEMES[1];
function sync(){
  document.querySelectorAll('.th').forEach(b => { const a = b.dataset.th === st.a, bb = st.cmp === '1' && b.dataset.th === st.b; b.classList.toggle('a', a); b.classList.toggle('b', bb && !a); b.querySelector('.tag').textContent = a ? (st.cmp === '1' ? 'A' : 'ON') : bb ? 'B' : ''; b.setAttribute('aria-pressed', a || bb); });
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === st.tab));
  document.querySelectorAll('[data-dev]').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === st.dev));
  document.querySelectorAll('[data-cmp]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cmp === st.cmp));
  $('#main').classList.toggle('phone', st.dev === 'phone'); $('#main').classList.toggle('cmp', st.cmp === '1');
  $('#capA').innerHTML = st.cmp === '1' ? `<i style="background:#111827">A</i>${T(st.a)[1]}` : ''; $('#capB').innerHTML = `<i style="background:#C2410C">B</i>${T(st.b)[1]}`;
  $('#hint').textContent = st.cmp === '1' ? 'Compare: click a theme to set A, Shift-click (or long-press) to set B. Both show the same page.' : 'Click a theme to switch instantly. ← → keys step through themes.';
  if(st.cmp === '1' && F.B.el.getAttribute('src') === 'about:blank') F.B.el.setAttribute('src', '../');
  if($('#about').classList.contains('on')) about();
  history.replaceState(null, '', '#' + new URLSearchParams(st));
}
function applyTheme(k){ const f = F[k]; if(!f.ready) return; const d = f.el.contentDocument, t = T(k === 'A' ? st.a : st.b);
  d.querySelectorAll('link[data-nth]').forEach(l => l.remove());
  if(t[0] === 'cur'){ d.documentElement.removeAttribute('data-th'); return; }
  ['neutral.css','mist.css','base.css',t[3] + '.css'].forEach(f2 => { const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = new URL('../themes/' + f2, location.href).href; l.dataset.nth = '1'; d.head.appendChild(l); });
  d.documentElement.setAttribute('data-th', t[0]); }
function openTab(k){ const f = F[k]; if(!f.ready) return; const w = f.el.contentWindow;
  try{ if(w.mhClose) w.mhClose(); w.scrollTo(0, 0);
    if(st.tab === 'bank'){ w.colTab = 'cash'; w.pickLens('collections','supplier'); }
    else if(st.tab === 'history'){ if(w.mhEditHistory) w.mhEditHistory(); else w.go('settings'); }
    else w.go(st.tab); }catch(e){ note('That page could not open here.'); } }
function both(fn){ fn('A'); if(st.cmp === '1') fn('B'); }
['A','B'].forEach(k => F[k].el.addEventListener('load', () => { if(F[k].el.getAttribute('src') === 'about:blank') return; const w = F[k].el.contentWindow; let n = 0;
  const wait = setInterval(() => { n++; if(w.navigate && w.go){ clearInterval(wait); setTimeout(() => { try{ w.navigate('dashboard'); }catch(e){} F[k].ready = true; applyTheme(k); openTab(k); }, 500); } else if(n > 120){ clearInterval(wait); note('The dashboard did not load.'); } }, 100); }));
function pick(id, b){ if(st.cmp === '1' && b){ st.b = id; sync(); applyTheme('B'); } else { st.a = id; sync(); applyTheme('A'); } note(T(id)[1]); }
$('#themes').addEventListener('click', e => { const b = e.target.closest('.th'); if(b) pick(b.dataset.th, e.shiftKey); });
let lp; $('#themes').addEventListener('pointerdown', e => { const b = e.target.closest('.th'); if(!b || st.cmp !== '1') return; lp = setTimeout(() => { lp = 'done'; pick(b.dataset.th, true); }, 550); });
$('#themes').addEventListener('pointerup', () => { if(lp !== 'done') clearTimeout(lp); });
$('#themes').addEventListener('click', e => { if(lp === 'done'){ e.stopImmediatePropagation(); lp = null; } }, true);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; st.tab = b.dataset.tab; sync(); both(openTab); });
document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => { st.dev = b.dataset.dev; sync(); }));
document.querySelectorAll('[data-cmp]').forEach(b => b.addEventListener('click', () => { st.cmp = b.dataset.cmp; sync(); if(st.cmp === '1' && F.B.ready){ applyTheme('B'); openTab('B'); } }));
function about(){ const t = T(st.a);
  $('#about').innerHTML = `<div><h2>${t[1]}${t[4] ? ' · ' + t[4] : ''}</h2><p>${t[6] || 'The app as it looks today.'}</p>
    <h2 style="margin-top:12px">What stays exactly the same</h2><ul><li>All 22 pages, every tab inside them, every menu item and the order of the menu.</li><li>Every table, card, number, chart, form, button and what it does.</li><li>Owner and staff permissions, the demo data, phone layout and bottom menu.</li><li>Only fonts, colours, spacing, borders, shadows, button and badge styling change.</li></ul></div>
    <div><h2>Quality check</h2><div class="qc">${['Looks premium','Typography professionally selected','Colours harmonious, each with one meaning','Tables and cards well styled','Buttons polished (hover, press, disabled, focus)','Cohesive across every page','Easy to navigate','Financial figures easy to read','Alerts and statuses instantly clear','Has its own recognizable identity'].map(q => `<b>✓</b><span>${q}</span>`).join('')}</div>
    <p style="margin-top:8px">Checked on every page at desktop and phone width. Red always means late, short or a loss; amber means order soon or pending; green means done or healthy.</p></div>`; }
$('#btnAbout').addEventListener('click', () => { const on = !$('#about').classList.contains('on'); $('#about').classList.toggle('on', on); $('#btnAbout').setAttribute('aria-expanded', on); if(on) about(); });
document.addEventListener('keydown', e => { if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; const i = THEMES.findIndex(t => t[0] === st.a);
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ pick(THEMES[(i + (e.key === 'ArrowRight' ? 1 : THEMES.length - 1)) % THEMES.length][0]); } });
sync();
</script>
</body>
</html>
