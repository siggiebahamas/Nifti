<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PermitPal — 10 dashboard concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@500&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EDEAE4;color:#1C1917}
button{font:inherit;cursor:pointer}
.picker{position:sticky;top:0;z-index:50;background:#1C1917;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picker b{font-size:13px;margin-right:6px;opacity:.8}
.picker button{border:0;border-radius:999px;padding:7px 12px;background:#2E2A26;color:#EDE7DD;font-size:12.5px;font-weight:600}
.picker button.on{background:#F59E0B;color:#1C1917}
.picker .sp{flex:1}
.about{max-width:1180px;margin:14px auto 0;padding:0 14px;font-size:14px;color:#57534E}
.about h2{margin:0 0 2px;font-size:20px;color:#1C1917}
.frame{max-width:1180px;margin:12px auto 40px;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);background:#fff}
.frame.phone{max-width:390px}
.phone .hide-sm{display:none!important}
.phone .g2,.phone .g3,.phone .g4,.phone .g5{grid-template-columns:1fr!important}
.phone .row2{flex-direction:column!important}
.phone .sidebar{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:760px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.hide-sm{display:none!important}.row2{flex-direction:column!important}.sidebar{display:none!important}}
.row2{display:flex;gap:18px}

/* ===== 1 SUNRISE LEDGER (Buzz/Nifti family) ===== */
.t1{background:#F8F6F2;min-height:100%;display:flex}
.t1 .sidebar{width:220px;background:#FBFAF7;border-right:1px solid #ECE8E1;padding:20px 14px}
.t1 .brand{font-weight:800;font-size:20px;color:#1E2A4A;display:flex;gap:8px;align-items:center;margin-bottom:22px}
.t1 .brand i{width:30px;height:30px;border-radius:50%;background:#1E2A4A;display:grid;place-items:center;color:#F59E0B;font-style:normal}
.t1 .nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;color:#44403C;font-weight:600;font-size:14px;text-decoration:none}
.t1 .nav a.on{background:#FEF3E2;color:#B45309}
.t1 main{flex:1;padding:26px 30px;min-width:0}
.t1 .hero{border-radius:22px;padding:26px 28px;background:radial-gradient(circle at 85% 20%,#F59E0B55,transparent 40%),linear-gradient(135deg,#1E2A4A,#2C3E6B);color:#fff;display:flex;gap:24px;align-items:center;position:relative;overflow:hidden}
.t1 .hero h1{font-family:Fraunces,serif;font-size:32px;margin:0 0 6px;font-weight:700}
.t1 .hero h1 em{color:#FBBF24;font-style:italic}
.t1 .hero p{margin:0;opacity:.8}
.t1 .ring{width:128px;height:128px;flex-shrink:0;position:relative}
.t1 .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-family:Fraunces,serif}
.t1 .ring small{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.7}
.t1 .kpi{background:#fff;border:1px solid #ECE8E1;border-radius:18px;padding:16px;transition:.2s;box-shadow:0 1px 2px rgba(28,25,23,.04)}
.t1 .kpi:hover{transform:translateY(-3px);box-shadow:0 10px 30px -12px rgba(28,25,23,.18)}
.t1 .kpi .n{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1}
.t1 .kpi .l{font-size:12.5px;color:#78716C;font-weight:600;margin-top:4px}
.t1 .kpi .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.t1 h2{font-family:Fraunces,serif;font-size:22px;margin:26px 0 12px;color:#1C1917}
.t1 .card{background:#fff;border:1px solid #ECE8E1;border-radius:18px;padding:6px}
.t1 .act{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px}
.t1 .act:hover{background:#FFF8EE}
.t1 .act .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.t1 .act .m{flex:1;min-width:0}.t1 .act b{display:block;font-size:14.5px}.t1 .act span{font-size:12.5px;color:#78716C}
.t1 .btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.t1 .ent{background:#fff;border:1px solid #ECE8E1;border-radius:18px;overflow:hidden;transition:.2s}
.t1 .ent:hover{transform:translateY(-3px);box-shadow:0 10px 30px -12px rgba(28,25,23,.18)}
.t1 .ent .top{height:74px;position:relative}
.t1 .ent .top i{position:absolute;left:14px;bottom:-18px;width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.1);font-style:normal}
.t1 .ent .body{padding:24px 14px 14px}.t1 .ent b{font-size:14.5px}.t1 .ent .s{font-size:12px;color:#78716C}
.t1 .bar{height:7px;background:#F1EADF;border-radius:9px;margin-top:10px;overflow:hidden}.t1 .bar div{height:100%;border-radius:9px}

/* ===== 2 COMMAND CENTER (dark, glowing) ===== */
.t2{background:#070B18;color:#DCE4FF;min-height:100%;padding:24px 28px;font-family:'Space Grotesk',sans-serif;background-image:radial-gradient(circle at 0 0,#1B2A6B55,transparent 45%),radial-gradient(circle at 100% 100%,#6B1B5E44,transparent 40%)}
.t2 .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.t2 .top h1{margin:0;font-size:26px;letter-spacing:-.5px}.t2 .top span{color:#7F8BB5;font-size:13px}
.t2 .live{font-size:12px;color:#5CFFB0;border:1px solid #5CFFB044;padding:5px 10px;border-radius:999px}
.t2 .live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5CFFB0;margin-right:6px;box-shadow:0 0 8px #5CFFB0}
.t2 .panel{background:#0E1430;border:1px solid #1E2856;border-radius:18px;padding:18px}
.t2 .gauge{display:flex;align-items:center;gap:18px}
.t2 .gauge b{font-size:44px;color:#fff}
.t2 .tile{border-radius:16px;padding:16px;border:1px solid;position:relative;overflow:hidden}
.t2 .tile .n{font-size:40px;font-weight:700;line-height:1}
.t2 .tile .l{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-top:6px}
.t2 .q{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#121A3D;margin-bottom:8px;border-left:3px solid}
.t2 .q b{font-size:14.5px;color:#fff}.t2 .q span{font-size:12.5px;color:#7F8BB5}.t2 .q .m{flex:1}
.t2 .q button{border:1px solid;background:transparent;border-radius:10px;padding:7px 12px;font-weight:700;font-size:12.5px}
.t2 .heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:10px}
.t2 .heat div{height:34px;border-radius:6px}
.t2 .heat small{font-size:10px;color:#7F8BB5;text-align:center}

/* ===== 3 PASSPORT STAMPS ===== */
.t3{background:#F3EBDD;background-image:radial-gradient(#E4D7C1 1px,transparent 1px);background-size:18px 18px;min-height:100%;padding:26px 30px;color:#2B2118}
.t3 .pass{background:#6E1F2B;color:#F4E6C8;border-radius:16px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px -12px #6E1F2B99;border:3px double #D9B97A}
.t3 .pass h1{font-family:'Playfair Display',serif;font-size:30px;margin:0;letter-spacing:1px}
.t3 .pass p{margin:4px 0 0;font-size:13px;opacity:.8;letter-spacing:.15em;text-transform:uppercase}
.t3 .pass .seal{width:96px;height:96px;border-radius:50%;border:3px solid #D9B97A;display:grid;place-items:center;text-align:center;font-family:'Playfair Display',serif;font-size:26px;line-height:1}
.t3 .pass .seal small{display:block;font-size:9px;letter-spacing:.2em}
.t3 h2{font-family:'Playfair Display',serif;font-size:22px;margin:24px 0 12px}
.t3 .stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.t3 .st{background:#FFFDF7;border:1.5px dashed #BFA67A;border-radius:12px;padding:14px;position:relative;min-height:128px}
.t3 .st b{font-size:14px;display:block;padding-right:54px}.t3 .st span{font-size:12px;color:#7A6A55}
.t3 .st .stamp{position:absolute;right:10px;top:10px;width:62px;height:62px;border-radius:50%;border:3px solid;display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-align:center;transform:rotate(-14deg);font-family:'IBM Plex Mono',monospace;line-height:1.1;opacity:.85}
.t3 .st button{margin-top:10px;background:#2B2118;color:#F4E6C8;border:0;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700}

/* ===== 4 TRAFFIC LIGHT BOARD ===== */
.t4{background:#F4F5F7;min-height:100%;padding:26px 28px}
.t4 h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}.t4 .sub{color:#667085;margin:4px 0 18px}
.t4 .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.t4 .lane{border-radius:22px;padding:14px;min-height:380px}
.t4 .lane h3{margin:2px 4px 12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:16px}
.t4 .lane h3 span{background:#ffffff33;border-radius:999px;padding:2px 10px;font-size:13px}
.t4 .lamp{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;display:inline-block;margin-right:8px;vertical-align:-2px}
.t4 .tk{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 6px 16px -8px rgba(0,0,0,.25)}
.t4 .tk b{font-size:14px;display:block}.t4 .tk span{font-size:12.5px;color:#667085}
.t4 .tk .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.t4 .tk .who{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#F2F4F7}
.t4 .tk button{border:0;border-radius:8px;padding:6px 11px;font-weight:700;font-size:12px;color:#fff}

/* ===== 5 CALENDAR HORIZON ===== */
.t5{background:linear-gradient(180deg,#E8F1FF 0,#fff 320px);min-height:100%;padding:26px 30px;color:#0B1B3A}
.t5 h1{font-size:30px;margin:0;font-weight:800}.t5 .sub{color:#4A5B7A;margin:4px 0 20px}
.t5 .strip{background:#fff;border-radius:20px;padding:18px 18px 14px;box-shadow:0 10px 30px -18px #1B4DB5}
.t5 .months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.t5 .mo{border-radius:12px;padding:8px 6px;min-height:118px;background:#F5F8FF;position:relative}
.t5 .mo.now{background:#0B1B3A;color:#fff}
.t5 .mo small{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.7}
.t5 .pin{display:block;font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 5px;margin-top:5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5 .legend{display:flex;gap:14px;font-size:12.5px;color:#4A5B7A;margin-top:12px}
.t5 .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.t5 .nx{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px -14px #1B4DB5}
.t5 .date{width:58px;text-align:center;border-radius:12px;padding:6px 0;color:#fff;flex-shrink:0}
.t5 .date b{display:block;font-size:22px;line-height:1}.t5 .date small{font-size:11px;font-weight:700;letter-spacing:.1em}
.t5 .nx .m{flex:1}.t5 .nx b{font-size:14.5px}.t5 .nx span{font-size:12.5px;color:#4A5B7A;display:block}
.t5 button{border:0;border-radius:10px;padding:8px 14px;background:#1B4DB5;color:#fff;font-weight:700;font-size:13px}

/* ===== 6 JEEPNEY POP (tropical, Filipino) ===== */
.t6{background:#FFF7E8;min-height:100%;padding:24px 28px;font-family:'Baloo 2','Plus Jakarta Sans',sans-serif;color:#1D1235}
.t6 .hero{border-radius:28px;padding:24px 26px;background:linear-gradient(120deg,#FF3D7F,#FF8A00 55%,#FFD400);color:#fff;position:relative;overflow:hidden}
.t6 .hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:#00C2A8;opacity:.9}
.t6 .hero h1{font-size:34px;margin:0;line-height:1.05;position:relative;z-index:1}.t6 .hero p{margin:6px 0 0;font-size:17px;position:relative;z-index:1}
.t6 .stripes{height:10px;margin:14px 0;border-radius:9px;background:repeating-linear-gradient(90deg,#FF3D7F 0 30px,#FFD400 30px 60px,#00C2A8 60px 90px,#5B2BFF 90px 120px)}
.t6 .bub{border-radius:24px;padding:16px;color:#fff;box-shadow:0 8px 0 #1D123522;transform:rotate(-1deg)}
.t6 .bub:nth-child(even){transform:rotate(1deg)}
.t6 .bub .n{font-size:44px;font-weight:800;line-height:1}.t6 .bub .l{font-size:16px;font-weight:600}
.t6 h2{font-size:26px;margin:20px 0 10px}
.t6 .ride{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #1D1235;border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:4px 4px 0 #1D1235}
.t6 .ride .em{font-size:28px}.t6 .ride .m{flex:1}.t6 .ride b{font-size:17px;line-height:1.1;display:block}.t6 .ride span{font-size:14px;color:#5B4E7A}
.t6 .ride button{border:3px solid #1D1235;border-radius:14px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:2px 2px 0 #1D1235}

/* ===== 7 GLASS AURORA ===== */
.t7{min-height:100%;padding:26px 30px;color:#fff;background:linear-gradient(135deg,#0F2027,#203A43 40%,#2C5364);position:relative;overflow:hidden}
.t7:before,.t7:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.t7:before{width:460px;height:460px;background:#7C3AED;top:-120px;right:-80px}
.t7:after{width:420px;height:420px;background:#06B6D4;bottom:-160px;left:-100px}
.t7 > *{position:relative;z-index:1}
.t7 .gl{background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:18px}
.t7 h1{font-size:30px;margin:0 0 4px;font-weight:700}.t7 .sub{opacity:.75;margin:0 0 18px}
.t7 .n{font-size:36px;font-weight:800;line-height:1}.t7 .l{font-size:12.5px;opacity:.8}
.t7 .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.14)}
.t7 .it:last-child{border:0}.t7 .it .m{flex:1}.t7 .it b{font-size:14.5px}.t7 .it span{display:block;font-size:12.5px;opacity:.7}
.t7 .pill{border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700}
.t7 button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:7px 12px;font-weight:700;font-size:12.5px}

/* ===== 8 THE COMPLIANCE DAILY (editorial) ===== */
.t8{background:#FAF8F3;min-height:100%;padding:26px 34px;color:#111;font-family:Georgia,serif}
.t8 .mast{text-align:center;border-bottom:3px double #111;padding-bottom:10px}
.t8 .mast h1{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;margin:0;letter-spacing:-1px}
.t8 .mast .meta{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.14em;border-top:1px solid #111;margin-top:8px;padding-top:6px;font-family:'Plus Jakarta Sans',sans-serif}
.t8 .lead{display:grid;grid-template-columns:2fr 1fr;gap:26px;margin-top:20px}
.t8 .kicker{font-family:'Plus Jakarta Sans',sans-serif;color:#B91C1C;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.t8 .lead h2{font-family:'Playfair Display',serif;font-size:36px;line-height:1.08;margin:6px 0 10px}
.t8 .lead p{font-size:16px;line-height:1.55;margin:0 0 12px}
.t8 .lead button{font-family:'Plus Jakarta Sans',sans-serif;background:#111;color:#FAF8F3;border:0;padding:10px 16px;font-weight:700}
.t8 .side{border-left:1px solid #111;padding-left:22px}
.t8 .fig{font-family:'Playfair Display',serif;font-size:64px;font-weight:900;line-height:.9}
.t8 .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px;border-top:1px solid #111;padding-top:14px}
.t8 .cols h3{font-family:'Playfair Display',serif;font-size:19px;margin:4px 0 6px}.t8 .cols p{font-size:14px;line-height:1.5;margin:0}

/* ===== 9 WALLET PASSES ===== */
.t9{background:#F2F2F7;min-height:100%;padding:26px 30px;color:#111}
.t9 h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.6px}.t9 .sub{color:#6B6B76;margin:4px 0 20px}
.t9 .stack{position:relative}
.t9 .pass{border-radius:20px;padding:18px 20px;color:#fff;margin-bottom:-58px;box-shadow:0 -6px 20px -8px rgba(0,0,0,.35);position:relative;transition:.25s;min-height:150px}
.t9 .stack:hover .pass{margin-bottom:12px}
.t9 .pass:last-child{margin-bottom:0}
.t9 .pass .h{display:flex;justify-content:space-between;align-items:flex-start}
.t9 .pass small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.t9 .pass b{display:block;font-size:19px}
.t9 .pass .f{display:flex;gap:26px;margin-top:22px}.t9 .pass .f div{font-size:15px;font-weight:700}
.t9 .pass .status{background:rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800}
.t9 .sum{background:#fff;border-radius:20px;padding:18px}
.t9 .sum .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #EEE}
.t9 .sum .row:last-child{border:0}
.t9 .big{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}

/* ===== 10 SCORE COACH (gamified) ===== */
.t10{background:linear-gradient(180deg,#F0FDF4,#fff 260px);min-height:100%;padding:26px 30px;color:#052E16}
.t10 .hero{display:flex;gap:26px;align-items:center;background:#fff;border-radius:26px;padding:22px 26px;box-shadow:0 18px 40px -26px #15803D}
.t10 .score{width:150px;height:150px;flex-shrink:0;position:relative}
.t10 .score b{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800}
.t10 h1{font-size:28px;margin:0 0 6px}.t10 p{margin:0;color:#3F6B50}
.t10 .lvl{display:inline-flex;gap:6px;align-items:center;background:#DCFCE7;color:#166534;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px;margin-top:10px}
.t10 .quest{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid #DCFCE7;border-radius:18px;padding:12px 14px;margin-bottom:10px}
.t10 .quest .chk{width:30px;height:30px;border-radius:50%;border:3px solid #BBF7D0;flex-shrink:0}
.t10 .quest .m{flex:1}.t10 .quest b{font-size:14.5px}.t10 .quest span{font-size:12.5px;color:#3F6B50;display:block}
.t10 .xp{font-weight:800;font-size:12px;color:#15803D;background:#F0FDF4;border-radius:8px;padding:4px 8px}
.t10 .quest button{border:0;border-radius:12px;padding:8px 14px;background:#16A34A;color:#fff;font-weight:800;font-size:13px}
.t10 .team{background:#fff;border-radius:20px;padding:16px;text-align:center;border:2px solid #F0FDF4}
.t10 .team b{display:block;margin-top:8px;font-size:14px}.t10 .team span{font-size:12px;color:#3F6B50}
</style>
</head>
<body>
<div class="picker" id="picker"><b>PermitPal dashboard concepts</b></div>
<div class="about" id="about"></div>
<div class="frame" id="frame"><div id="stage"></div></div>

<script>
// ---------------- shared sample data (same as the live demo) ----------------
const D = {

const ring = (pct, size, stroke, color, track) => {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track}" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
};

  <div class="row2" style="margin-top:20px"><div style="flex:1.4"><h3 style="margin:0 0 10px">Today's quests</h3>
    ${D.actions.slice(0,5).map((a,i) => `<div class="quest"><div class="chk"></div><div class="m"><b>${a.btn} ${a.name}</b><span>${a.who} · ${a.due}</span></div><span class="xp">+${[12,12,8,8,6][i]} pts</span><button>${a.btn}</button></div>`).join('')}</div>
    <div style="flex:1"><h3 style="margin:0 0 10px">Leaderboard</h3><div class="g2">${D.entities.slice().sort((a,b)=>b.pct-a.pct).slice(0,4).map((e,i) => `<div class="team"><div style="position:relative;width:74px;height:74px;margin:0 auto">${ring(e.pct,74,8,e.pct>=80?'#16A34A':e.pct>=50?'#F5A524':'#E5484D','#F0FDF4')}<b style="position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:16px">${e.pct}%</b></div><b>${['🥇','🥈','🥉','4th'][i]} ${e.name}</b><span>${e.meta}</span></div>`).join('')}</div></div></div>
</div>` });

// ---------------- picker ----------------
let cur = 0, phone = false;
const picker = document.getElementById('picker');
T.forEach((t, i) => { const b = document.createElement('button'); b.textContent = `${i + 1}. ${t.name}`; b.onclick = () => { cur = i; draw(); }; picker.appendChild(b); });
const sp = document.createElement('span'); sp.className = 'sp'; picker.appendChild(sp);
const pb = document.createElement('button'); pb.onclick = () => { phone = !phone; draw(); }; picker.appendChild(pb);
function draw() {
  [...picker.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('on', i === cur));
  pb.textContent = phone ? '🖥  Desktop view' : '📱  Phone view';
  document.getElementById('frame').className = 'frame' + (phone ? ' phone' : '');
  document.getElementById('about').innerHTML = `<h2>${cur + 1}. ${T[cur].name}</h2>${T[cur].note}`;
  document.getElementById('stage').innerHTML = T[cur].html();
  scrollTo(0, 0);
}
draw();
</script>
</body>
</html>
