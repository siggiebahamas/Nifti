<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PermitPal — Businesses & Vehicles layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F2;--card:#fff;--line:#E9E4DB;--ink:#0B1B3A;--text:#1F2A44;--muted:#4B5568;--brand:#1B4DB5;--soft:#E3ECFF;
--red:#E5484D;--amber:#FBBF24;--amberInk:#C97800;--blue:#2563EB;--gray:#5F6B7E;--green:#22A06B}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#E9E5DE;color:var(--text)}
button{font:inherit;cursor:pointer}
.picker{position:sticky;top:0;z-index:50;background:#0B1B3A;color:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker b{font-size:13px;opacity:.8;margin-right:4px}
.picker button{border:0;border-radius:999px;padding:7px 12px;background:#1C2C50;color:#DCE4FF;font-size:12.5px;font-weight:700}
.picker button.on{background:#fff;color:#0B1B3A}.picker .sp{flex:1}
.about{max-width:1120px;margin:14px auto 0;padding:0 16px;font-size:14.5px;color:#44403C}
.about h2{margin:0 0 3px;font-size:21px;color:var(--ink)}
.about .why{margin-top:4px;font-size:13.5px}.about .why b{color:var(--ink)}
.frame{max-width:1120px;margin:12px auto 40px;background:var(--bg);border-radius:18px;box-shadow:0 20px 50px -24px rgba(0,0,0,.4);padding:26px 28px;overflow:hidden}
.frame.phone{max-width:390px;padding:18px 14px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.4px}.ph p{margin:2px 0 0;color:var(--muted)}
.btnp{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;color:#fff;white-space:nowrap}
.c-over{background:var(--red)}.c-soon{background:var(--amber);color:#3F2A00}.c-prog{background:var(--blue)}.c-info{background:var(--gray)}.c-ok{background:var(--green)}
.t-over{color:#D12F35}.t-soon{color:var(--amberInk)}.t-prog{color:var(--blue)}.t-info{color:var(--gray)}.t-ok{color:#178354}
.bg-over{background:var(--red)}.bg-soon{background:var(--amber)}.bg-prog{background:var(--blue)}.bg-info{background:#8B95A7}.bg-ok{background:var(--green)}
.sec{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.phone .g2,.phone .g3{grid-template-columns:1fr}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.frame{padding:18px 14px}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(28,25,23,.04),0 6px 18px -14px rgba(28,25,23,.25)}
.lift{transition:transform .18s,box-shadow .18s}.lift:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(28,25,23,.35)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.scroll{overflow-x:auto}

/* 1 plates & storefronts */
.store{overflow:hidden}.awn{height:34px;background:repeating-linear-gradient(90deg,var(--c) 0 28px,#fff 28px 56px);position:relative}
.awn:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:12px;background:radial-gradient(circle at 14px 0,var(--c) 13px,transparent 14px) 0 0/28px 12px repeat-x}
.store .b{padding:22px 16px 14px}.store h3{margin:0;font-size:17px;color:var(--ink)}.store .m{font-size:13px;color:var(--muted)}
.store .door{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.plate{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line)}
.plate .pl{border:3px solid #0B1B3A;border-radius:10px;background:linear-gradient(#fff,#F4F7FB);text-align:center;padding:4px 0 6px;position:relative}
.plate .pl small{display:block;font-size:10px;letter-spacing:.3em;font-weight:800;color:#1B4DB5}
.plate .pl b{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.08em;color:#0B1B3A}
.plate .pl i{position:absolute;bottom:3px;right:8px;font-style:normal;font-size:9px;font-weight:800;color:var(--muted)}
.plate .who{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.plate .who b{color:var(--ink)}

/* 2 segment bars */
.seg{display:flex;align-items:center;gap:16px;padding:14px 16px}
.seg .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.seg .nm{width:230px;flex-shrink:0}.seg .nm b{color:var(--ink);font-size:15.5px;display:block}.seg .nm span{font-size:12.5px;color:var(--muted)}
.seg .bar{flex:1;display:flex;gap:4px;min-width:0}
.seg .bar div{flex:1;height:38px;border-radius:8px;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:flex-end;padding:4px 6px;overflow:hidden;white-space:nowrap}
.seg .bar div.bg-soon{color:#3F2A00}
.seg .pct{width:54px;text-align:right;font-weight:800;font-size:20px;color:var(--ink)}
.phone .seg,.seg.wrap{flex-wrap:wrap}.phone .seg .nm{width:auto;flex:1}.phone .seg .bar{flex-basis:100%;order:3}
@media(max-width:760px){.seg{flex-wrap:wrap}.seg .nm{width:auto;flex:1}.seg .bar{flex-basis:100%;order:3}}

/* 3 matrix */
.mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:12.5px;min-width:760px}
.mx th{font-size:11.5px;color:var(--muted);text-align:center;font-weight:800;padding:4px}
.mx th:first-child{text-align:left}
.mx td.n{background:#fff;border-radius:10px;padding:10px 12px;font-weight:800;color:var(--ink);white-space:nowrap}.mx td.n small{display:block;font-weight:600;color:var(--muted)}
.mx td.c{border-radius:10px;text-align:center;color:#fff;font-weight:800;padding:8px 4px;line-height:1.15}.mx td.c small{display:block;font-weight:700;font-size:10.5px;opacity:.9}
.mx td.c.bg-soon{color:#3F2A00}.mx td.na{background:repeating-linear-gradient(45deg,#EFEBE4 0 6px,#F6F3EE 6px 12px);border-radius:10px}

/* 4 swimlanes */
.lanes{min-width:820px}
.lanehead,.lane{display:grid;grid-template-columns:210px repeat(12,1fr);align-items:center}
.lanehead div{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.08em}
.lanehead div.now{color:#fff;background:#0B1B3A;border-radius:6px;padding:2px 0}
.lane{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:8px;min-height:62px;position:relative}
.lane .nm{padding:10px 14px;border-right:1px solid var(--line);height:100%}.lane .nm b{color:var(--ink);display:block}.lane .nm span{font-size:12px;color:var(--muted)}
.lane .cell{height:100%;border-right:1px dashed #EFEBE4;display:flex;flex-direction:column;gap:3px;justify-content:center;align-items:center;padding:4px 2px}
.dot{border-radius:999px;font-size:10px;font-weight:800;color:#fff;padding:3px 7px;white-space:nowrap}.dot.bg-soon{color:#3F2A00}

/* 5 rings */
.ringc{padding:18px;text-align:center}.ringc h3{margin:10px 0 0;font-size:16px;color:var(--ink)}.ringc .m{font-size:12.5px;color:var(--muted)}
.ringc .rw{position:relative;width:128px;height:128px;margin:0 auto}.ringc .rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--ink)}
.ringc .leg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ringc .nx{margin-top:10px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}

/* 6 report cards */
.rc{padding:0;overflow:hidden;background:#FFFEF9;font-family:'Plus Jakarta Sans'}
.rc .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid #0B1B3A}
.rc .top b{font-size:16px;color:var(--ink)}.rc .top small{display:block;font-size:12px;color:var(--muted)}
.rc .gr{width:62px;height:62px;border-radius:50%;border:3px solid;display:grid;place-items:center;font-family:Fraunces,serif;font-size:32px;font-weight:800;transform:rotate(-8deg)}
.rc .ln{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid #EFEBE4;font-size:13.5px;background-image:linear-gradient(90deg,transparent 30px,#F7D8D8 30px,#F7D8D8 31px,transparent 31px)}
.rc .ln span{padding-left:22px;color:var(--ink);font-weight:600}.rc .ln b{font-size:12.5px}
.rc .ft{padding:10px 16px;font-size:12.5px;color:var(--muted);font-style:italic}

/* 7 kanban */
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.phone .kb{grid-template-columns:1fr}
@media(max-width:760px){.kb{grid-template-columns:1fr}}
.kcol{border-radius:18px;padding:12px;min-height:300px}.kcol h3{margin:2px 4px 12px;font-size:15px;display:flex;justify-content:space-between;color:var(--ink)}
.kcol h3 span{background:#fff;border-radius:999px;padding:1px 10px;font-size:13px}
.kcard{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 6px 16px -10px rgba(0,0,0,.25)}
.kcard b{color:var(--ink)}.kcard .m{font-size:12.5px;color:var(--muted)}.kcard .n{font-size:13px;margin-top:8px}
.kcard .mini{display:flex;gap:3px;margin-top:8px}.kcard .mini i{flex:1;height:6px;border-radius:9px}

/* 8 accordion */
.acc{overflow:hidden}.acc summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.acc .nm{flex:1;min-width:0}.acc .nm b{color:var(--ink);font-size:15.5px}.acc .nm span{display:block;font-size:12.5px;color:var(--muted)}
.acc .cnt{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.acc .chev{transition:transform .2s;color:var(--muted)}.acc[open] .chev{transform:rotate(90deg)}
.acc .rows{border-top:1px solid var(--line);padding:4px 12px 10px 70px}
.acc .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F1EDE6;font-size:14px}.acc .r:last-child{border:0}
.acc .r .d{width:46px;text-align:center;border-radius:9px;color:#fff;font-size:10px;font-weight:800;padding:3px 0;line-height:1.1}.acc .r .d b{display:block;font-size:16px}
.acc .r .d.bg-soon{color:#3F2A00}.acc .r .x{flex:1}.acc .r .x b{color:var(--ink)}
.phone .acc .rows{padding-left:12px}.phone .acc .cnt{display:none}

/* 9 departure board */
.board{background:#101624;border-radius:18px;padding:18px;color:#E8EDF8;font-family:'IBM Plex Mono',monospace;box-shadow:inset 0 0 0 1px #2A3350}
.board .bt{display:flex;justify-content:space-between;font-family:'Plus Jakarta Sans';font-weight:800;letter-spacing:.14em;font-size:13px;color:#FBBF24;margin-bottom:10px}
.board table{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:720px}
.board th{text-align:left;font-size:11px;color:#8A96B5;letter-spacing:.14em;font-weight:500;padding:0 10px}
.board td{background:#1A2236;padding:10px;font-size:14px}.board td:first-child{border-radius:10px 0 0 10px}.board td:last-child{border-radius:0 10px 10px 0}
.flap{display:inline-block;background:#0B1020;border-radius:4px;padding:2px 5px;margin-right:2px;box-shadow:inset 0 -1px 0 #2A3350,inset 0 1px 0 #000;font-weight:700}
.board .st{font-family:'Plus Jakarta Sans';font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:6px}

/* 10 photo-first */
.photo{overflow:hidden}.photo .cov{height:130px;position:relative;display:flex;align-items:flex-end;padding:12px 14px;color:#fff}
.photo .cov svg.big{position:absolute;right:14px;top:12px;width:84px;height:84px;opacity:.28;stroke-width:1.2}
.photo .cov .pat{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#fff 1.2px,transparent 1.4px);background-size:14px 14px}
.photo .cov h3{margin:0;font-size:19px;position:relative;text-shadow:0 1px 8px rgba(0,0,0,.25)}.photo .cov small{display:block;font-size:12.5px;opacity:.9;font-weight:600}
.photo .cov .pct{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.95);color:var(--ink);font-weight:800;border-radius:999px;padding:3px 10px;font-size:13px}
.photo .bd{padding:12px 14px}.photo .bar{display:flex;height:8px;border-radius:9px;overflow:hidden;gap:2px}
.photo .nx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px;gap:8px}
</style>
</head>
<body>
<div class="picker" id="picker"><b>Businesses & Vehicles — 10 layouts</b></div>
<div class="about" id="about"></div>
<div class="frame" id="frame"><div id="stage"></div></div>
<script>
// ---- sample data (same as the demo) ----
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ST={over:'Overdue',soon:'Renew soon',prog:'In progress',info:'Needs info',ok:'Compliant'};
const B=[
 {id:'b1',name:'Corner Bakery & Co',meta:'Restaurant · 1 branch · Makati',kind:'biz',color:'#F97316',grad:['#F59E0B','#EA580C'],
  permits:[['Mayor\'s Permit','over','2026-09-26','4 days overdue'],['Barangay Clearance','info','2027-01-20','Upload the document'],['BIR 2303','info',null,'Add the details'],['FSIC','ok','2027-04-18','Valid until Apr 18'],['Sanitary Permit','ok','2027-06-07','Valid until Jun 7']]},
 {id:'b2',name:'Visayas Sari-Sari Distribution',meta:'Retail · 2 branches · Cebu',kind:'biz',color:'#0EA5E9',grad:['#10B981','#0EA5E9'],
  permits:[['Mayor\'s · Mandaue','over','2026-09-18','12 days overdue'],['Mayor\'s · Cebu','soon','2026-10-22','Due in 22 days'],['Barangay · Cebu','info','2027-01-20','Upload the document'],['Barangay · Mandaue','info','2027-01-20','Upload the document'],['FSIC · Mandaue','info',null,'Add the details'],['BIR 2303','ok',null,'Does not expire'],['FSIC · Cebu','ok','2027-02-07','Valid until Feb 7']]},
];
const V=[
 {id:'v1',name:'Isuzu Elf',plate:'NGV 5588',meta:'Van',kind:'veh',color:'#6366F1',grad:['#6366F1','#A855F7'],
  permits:[['LTO Registration','soon','2026-10-10','Due in 10 days'],['CTPL Insurance','info',null,'Add the details']]},
 {id:'v2',name:'Toyota Hilux',plate:'NBC 4417',meta:'Pickup',kind:'veh',color:'#0EA5E9',grad:['#0EA5E9','#22D3EE'],
  permits:[['LTO Registration','ok','2027-03-08','Valid until Mar 8'],['CTPL Insurance','ok','2027-03-08','Valid until Mar 8']]},
 {id:'v3',name:'Honda Click 125i',plate:'123 ABC',meta:'Motorcycle',kind:'veh',color:'#EC4899',grad:['#EC4899','#F43F5E'],
  permits:[['LTO Registration','soon','2026-10-05','Due in 5 days'],['CTPL Insurance','soon','2026-10-05','Due in 5 days']]},
];
const ALL=[...B,...V];
const ORDER=['over','soon','prog','info','ok'];
const cnt=e=>{const c={over:0,soon:0,prog:0,info:0,ok:0};e.permits.forEach(p=>c[p[1]]++);return c};
const pct=e=>Math.round(100*cnt(e).ok/e.permits.length);
const next=e=>[...e.permits].sort((a,b)=>ORDER.indexOf(a[1])-ORDER.indexOf(b[1]))[0];
const title=e=>e.kind==='veh'?`${e.name}`:e.name;
const sub=e=>e.kind==='veh'?`${e.plate} · ${e.meta}`:e.meta;
const chip=(s,t)=>`<span class="chip c-${s}">${t||ST[s]}</span>`;
const counts=e=>{const c=cnt(e);return ORDER.filter(k=>c[k]).map(k=>chip(k,`${c[k]} ${ST[k].toLowerCase()}`)).join('')};
const I={biz:'<svg class="i" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/></svg>',
veh:'<svg class="i" viewBox="0 0 24 24"><path d="M4 16v-4l1.7-4.2A2 2 0 0 1 7.5 6.5h9a2 2 0 0 1 1.8 1.3L20 12v4"/><path d="M4 16h16"/><circle cx="7.5" cy="17.5" r="1.4"/><circle cx="16.5" cy="17.5" r="1.4"/></svg>',
chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'};
const dt=d=>{if(!d)return['Date','?'];const[,m,dd]=d.split('-').map(Number);return[MON[m-1],dd]};
const head=(t,s,b)=>`<div class="ph"><div><h1>${t}</h1><p>${s}</p></div><button class="btnp">${b}</button></div>`;
const both=(fn,wrap='grid g3')=>`${head('Businesses','Every business, branch and the permits each one needs.','+ Add business')}<div class="${wrap}">${B.map(fn).join('')}</div>
<div class="sec">Vehicles — same layout</div><div class="${wrap}">${V.map(fn).join('')}</div>`;
function ring(e,size=128,sw=14){const r=(size-sw)/2,C=2*Math.PI*r,c=cnt(e),n=e.permits.length;let off=0;
 const col={over:'#E5484D',soon:'#FBBF24',prog:'#2563EB',info:'#8B95A7',ok:'#22A06B'};
 return `<svg width="${size}" height="${size}"><g transform="rotate(-90 ${size/2} ${size/2})">${ORDER.filter(k=>c[k]).map(k=>{const L=C*c[k]/n;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col[k]}" stroke-width="${sw}" stroke-dasharray="${Math.max(L-3,1)} ${C}" stroke-dashoffset="${-off}"/>`;off+=L;return s}).join('')}</g></svg>`}
const grade=p=>p>=90?['A','#178354']:p>=70?['B','#2563EB']:p>=50?['C','#C97800']:p>=30?['D','#EA580C']:['F','#D12F35'];

const T=[];
T.push({n:'Plates & Storefronts',d:'Businesses look like little shops with an awning in their health colour; vehicles look like real LTO plates. Instantly recognisable — you find your Hilux by its plate, not by reading.',w:'Most personality with zero extra reading. Owners think of vehicles by plate number.',
h:()=>{const hc=e=>{const p=pct(e);return p>=80?'#22A06B':p>=40?'#FBBF24':'#E5484D'};
 return `${head('Businesses','Every business, branch and the permits each one needs.','+ Add business')}<div class="grid g2">${B.map(e=>`<div class="card store lift" style="--c:${hc(e)}"><div class="awn"></div><div class="b"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${e.name}</h3><div class="m">${e.meta}</div></div><b style="font-size:24px;color:var(--ink)">${pct(e)}%</b></div><div class="door">${counts(e)}</div><div style="margin-top:10px;font-size:13.5px">Next: <b style="color:var(--ink)">${next(e)[0]}</b> · <b class="t-${next(e)[1]}">${next(e)[3]}</b></div></div></div>`).join('')}</div>
 <div class="sec">Vehicles</div><div class="grid g3">${V.map(e=>`<div class="plate lift card"><div class="pl"><small>PILIPINAS</small><b>${e.plate}</b><i>LTO</i></div><div class="who"><div><b>${e.name}</b><div style="font-size:12.5px;color:var(--muted)">${e.meta} · ${pct(e)}% compliant</div></div></div><div class="door" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${counts(e)}</div><div style="margin-top:8px;font-size:13.5px">Next: <b style="color:var(--ink)">${next(e)[0]}</b> · <b class="t-${next(e)[1]}">${next(e)[3]}</b></div></div>`).join('')}</div>`}});

T.push({n:'Permit Bars',d:'One wide row per business/vehicle. Each permit is a coloured block in a bar, so you see at a glance how much of it is red, yellow or green — like a phone battery for compliance.',w:'Most scannable for 10+ entities. Works well on phones.',
h:()=>{const row=e=>`<div class="card seg lift"><div class="ic">${I[e.kind]}</div><div class="nm"><b>${title(e)}</b><span>${sub(e)}</span></div><div class="bar">${[...e.permits].sort((a,b)=>ORDER.indexOf(a[1])-ORDER.indexOf(b[1])).map(p=>`<div class="bg-${p[1]}" title="${p[0]} · ${p[3]}">${p[0].split(' ')[0]}</div>`).join('')}</div><div class="pct">${pct(e)}%</div></div>`;
 return `${head('Businesses','Every business, branch and the permits each one needs.','+ Add business')}<div class="grid">${B.map(row).join('')}</div><div class="sec">Vehicles</div><div class="grid">${V.map(row).join('')}</div>`}});

T.push({n:'Compliance Matrix',d:'A spreadsheet-style grid: businesses down the side, permit types across the top, every cell coloured with its due date. Grey hatching = not needed. Like an Excel tracker, but alive.',w:'Best for power users and accountants managing many branches. Weaker on phones (scrolls sideways).',
h:()=>{const cols=['Mayor\'s','Barangay','BIR','FSIC','Sanitary'];const key=(e,c)=>e.permits.filter(p=>p[0].startsWith(c)||(c==='BIR'&&p[0].startsWith('BIR')));
 const vcols=['LTO Registration','CTPL Insurance'];
 const cell=ps=>ps.length?ps.map(p=>{const[m,d]=dt(p[2]);return `<td class="c bg-${p[1]}">${p[2]?m+' '+d:'—'}<small>${ST[p[1]]}${ps.length>1?' · '+(p[0].split('· ')[1]||''):''}</small></td>`})[0]:'<td class="na"></td>';
 return `${head('Businesses','Every permit, every branch, one grid.','+ Add business')}<div class="scroll"><table class="mx"><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Health</th></tr>
 ${B.flatMap(e=>{const locs=e.id==='b2'?['Cebu','Mandaue']:[null];return locs.map(l=>`<tr><td class="n">${e.name}${l?`<small>${l} branch</small>`:`<small>${e.meta}</small>`}</td>${cols.map(c=>{let ps=key(e,c);if(l)ps=ps.filter(p=>!p[0].includes('·')||p[0].includes(l));return cell(ps)}).join('')}<td class="n" style="text-align:center">${pct(e)}%</td></tr>`)}).join('')}</table></div>
 <div class="sec">Vehicles</div><div class="scroll"><table class="mx" style="min-width:520px"><tr><th></th>${vcols.map(c=>`<th>${c}</th>`).join('')}<th>Health</th></tr>${V.map(e=>`<tr><td class="n">${e.name}<small>${e.plate}</small></td>${vcols.map(c=>cell(e.permits.filter(p=>p[0]===c))).join('')}<td class="n" style="text-align:center">${pct(e)}%</td></tr>`).join('')}</table></div>`}});

T.push({n:'Timeline Lanes',d:'Each business or vehicle gets its own lane across the next 12 months, with coloured dots on the month each permit is due. Overdue items pile up in the first column. Ties in with the dashboard calendar.',w:'Great for planning cash flow per entity. Needs a wide screen.',
h:()=>{const months=['OVERDUE','SEP','OCT','NOV','DEC','JAN','FEB','MAR','APR','MAY','JUN','JUL'];
 const col=p=>{if(!p[2])return -1;if(p[1]==='over')return 0;const m=+p[2].split('-')[1];const i=(m-9+12)%12+1;return i};
 const lane=e=>`<div class="lane"><div class="nm"><b>${title(e)}</b><span>${sub(e)}</span></div>${months.map((_,i)=>`<div class="cell">${e.permits.filter(p=>col(p)===i).map(p=>`<span class="dot bg-${p[1]}" title="${p[0]}">${p[0].split(/[ ·]/)[0]}</span>`).join('')}</div>`).join('')}</div>`;
 return `${head('Businesses & vehicles','When each one needs you, month by month.','+ Add')}<div class="scroll"><div class="lanes"><div class="lanehead"><div></div>${months.map((m,i)=>`<div class="${i===1?'now':''}" style="${i===0?'color:#D12F35':''}">${m}</div>`).join('')}</div>${B.map(lane).join('')}<div class="sec">Vehicles</div>${V.map(lane).join('')}</div></div>`}});

T.push({n:'Health Rings',d:'Each business/vehicle is a big donut split by status colour, with the % in the middle. Feels like Apple Fitness rings — satisfying to "close" to 100% green.',w:'Very visual and motivating. Less detail per card.',
h:()=>both(e=>`<div class="card ringc lift"><div class="rw">${ring(e)}<b>${pct(e)}%</b></div><h3>${title(e)}</h3><div class="m">${sub(e)}</div><div class="leg">${counts(e)}</div><div class="nx">Next: <b style="color:var(--ink)">${next(e)[0]}</b><br><b class="t-${next(e)[1]}">${next(e)[3]}</b></div></div>`)});

T.push({n:'Report Cards',d:'Each business/vehicle gets a school-style report card with a stamped letter grade (A–F) and every permit listed like a subject. Owners instantly get "Visayas is failing".',w:'Memorable and fun, easy to explain to staff. The grade is a simplification.',
h:()=>both(e=>{const[g,c]=grade(pct(e));return `<div class="card rc lift"><div class="top"><div><b>${title(e)}</b><small>${sub(e)}</small></div><div class="gr" style="color:${c};border-color:${c}">${g}</div></div>${e.permits.map(p=>`<div class="ln"><span>${p[0]}</span><b class="t-${p[1]}">${p[3]}</b></div>`).join('')}<div class="ft">${pct(e)}% compliant · ${cnt(e).over?'Needs attention now':'Keep it up'}</div></div>`},'grid g2')});

T.push({n:'Health Board',d:'Businesses and vehicles sorted into three columns: Needs attention (red), Getting there (yellow), All clear (green). A mini status strip on each card. You always know where to look first.',w:'Answers "which one should I deal with?" without thinking. Mixes businesses and vehicles together.',
h:()=>{const lvl=e=>cnt(e).over?0:pct(e)>=80?2:1;const cols=[['Needs attention','#FDE3E3','over'],['Getting there','#FEF1CC','soon'],['All clear','#DDF3E8','ok']];
 return `${head('Businesses & vehicles','Sorted by how much they need you.','+ Add')}<div class="kb">${cols.map(([t,bg],i)=>{const list=ALL.filter(e=>lvl(e)===i);return `<div class="kcol" style="background:${bg}"><h3>${t}<span>${list.length}</span></h3>${list.map(e=>`<div class="kcard lift"><div style="display:flex;gap:8px;align-items:center;color:var(--brand)">${I[e.kind]}<b>${title(e)}</b><b style="margin-left:auto;color:var(--ink)">${pct(e)}%</b></div><div class="m">${sub(e)}</div><div class="mini">${[...e.permits].sort((a,b)=>ORDER.indexOf(a[1])-ORDER.indexOf(b[1])).map(p=>`<i class="bg-${p[1]}"></i>`).join('')}</div><div class="n">Next: <b>${next(e)[0]}</b> · <b class="t-${next(e)[1]}">${next(e)[3]}</b></div></div>`).join('')}</div>`}).join('')}</div>`}});

T.push({n:'Expandable List',d:'A tidy list, one line per business/vehicle with its status bubbles. Tap to open and see every permit with its date tile — no need to leave the page. The first one is shown open.',w:'Cleanest and most practical; scales to 50+ items. Least "wow".',
h:()=>{const it=(e,o)=>`<details class="card acc" ${o?'open':''} style="margin-bottom:10px"><summary><div class="ic">${I[e.kind]}</div><div class="nm"><b>${title(e)}</b><span>${sub(e)} · ${pct(e)}% compliant</span></div><div class="cnt">${counts(e)}</div>${I.chev}</summary><div class="rows">${e.permits.map(p=>{const[m,d]=dt(p[2]);return `<div class="r"><div class="d bg-${p[1]}">${m}<b>${d}</b></div><div class="x"><b>${p[0]}</b><br><b class="t-${p[1]}" style="font-size:13px">${p[3]}</b></div>${chip(p[1])}</div>`}).join('')}</div></details>`;
 return `${head('Businesses','Every business, branch and the permits each one needs.','+ Add business')}${B.map((e,i)=>it(e,i===1)).join('')}<div class="sec">Vehicles</div>${V.map(e=>it(e,false)).join('')}`}});

T.push({n:'Departure Board',d:'An airport split-flap board: every business and vehicle is a "flight", with its next permit, due date and a coloured status. Bold, dramatic, and the most urgent is always at the top.',w:'Biggest wow. Very readable at a distance (office TV). Less room for detail.',
h:()=>{const rows=[...ALL].sort((a,b)=>ORDER.indexOf(next(a)[1])-ORDER.indexOf(next(b)[1]));const flap=s=>String(s).toUpperCase().split('').map(c=>c===' '?'&nbsp;':`<span class="flap">${c}</span>`).join('');
 return `${head('Businesses & vehicles','Next up for each one, most urgent first.','+ Add')}<div class="board scroll"><div class="bt"><span>✈ PERMITPAL · NEXT DEADLINES</span><span>SEP 30 · 09:41</span></div><table><tr><th>BUSINESS / VEHICLE</th><th>NEXT PERMIT</th><th>DUE</th><th>STATUS</th><th>HEALTH</th></tr>${rows.map(e=>{const p=next(e);const[m,d]=dt(p[2]);return `<tr><td style="font-family:'Plus Jakarta Sans';font-weight:800">${title(e)}<div style="font-weight:500;font-size:12px;color:#8A96B5">${sub(e)}</div></td><td>${p[0]}</td><td>${p[2]?flap(m+' '+d):flap('--')}</td><td><span class="st bg-${p[1]}" style="color:${p[1]==='soon'?'#3F2A00':'#fff'}">${p[3].toUpperCase()}</span></td><td style="color:#FBBF24;font-weight:700">${pct(e)}%</td></tr>`}).join('')}</table></div>`}});

T.push({n:'Photo Cards',d:'Buzz-style: a big colourful cover for each business/vehicle (later, your own shop or vehicle photo), with the % badge on top and a stacked status bar underneath. The most "app store" look.',w:'Looks premium and matches Buzz. Uploading real photos would make it shine.',
h:()=>both(e=>{const c=cnt(e),n=e.permits.length;return `<div class="card photo lift"><div class="cov" style="background:linear-gradient(135deg,${e.grad[0]},${e.grad[1]})"><div class="pat"></div>${I[e.kind].replace('class="i"','class="i big"')}<span class="pct">${pct(e)}%</span><div style="position:relative"><h3>${title(e)}</h3><small>${sub(e)}</small></div></div><div class="bd"><div class="bar">${ORDER.filter(k=>c[k]).map(k=>`<div class="bg-${k}" style="flex:${c[k]}"></div>`).join('')}</div><div class="nx"><span>Next: <b style="color:var(--ink)">${next(e)[0]}</b></span><b class="t-${next(e)[1]}">${next(e)[3]}</b></div></div></div>`})});

let cur=0,phone=false;const pk=document.getElementById('picker');
T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${t.n}`;b.onclick=()=>{cur=i;draw()};pk.appendChild(b)});
const sp=document.createElement('span');sp.className='sp';pk.appendChild(sp);const pb=document.createElement('button');pb.onclick=()=>{phone=!phone;draw()};pk.appendChild(pb);
function draw(){[...pk.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===cur));pb.textContent=phone?'🖥 Desktop view':'📱 Phone view';
 document.getElementById('frame').className='frame'+(phone?' phone':'');
 document.getElementById('about').innerHTML=`<h2>${cur+1}. ${T[cur].n}</h2>${T[cur].d}<div class="why"><b>Trade-off:</b> ${T[cur].w}</div>`;
 document.getElementById('stage').innerHTML=T[cur].h();scrollTo(0,0)}
draw();
</script>
</body>
</html>
