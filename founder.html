<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nifti Founder</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#101828;--ink2:#344054;--line:#E4E7EC;--g:#1F6B45;--gbg:#EAF6EF;--bg:#F5F6F8;}
*{box-sizing:border-box}html,body{margin:0}
body{font:15.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tin{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo i{width:32px;height:32px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal}
.logo small{font-weight:700;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:999px;padding:2px 9px}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--gbg);color:var(--g)}.tabs b{background:#D92D20;color:#fff;border-radius:50%;font-size:12.5px;width:22px;height:22px;display:inline-grid;place-items:center;padding:0;line-height:1}
.who{font-size:14px;color:var(--ink2)}.link{border:0;background:none;color:var(--g);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--ink2);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.k em{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--ink2)}
.k b{display:block;font-size:26px;font-weight:800;line-height:1.25}.k span{font-size:13.5px;color:var(--ink2)}.k.g{background:var(--gbg);border-color:#CDE9D8}.k.r{background:#FDECEC;border-color:#F9D0CE}.k.y{background:#FEF9C3;border-color:#F5E58A}
.k.click{cursor:pointer}.k.click:hover{border-color:var(--g)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}.card h2{font-size:16.5px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:2px solid #D0D5DD;padding-top:6px}.chart i{flex:1;background:#E4E7EC;border-radius:3px 3px 0 0;min-height:3px;position:relative}.chart i.on{background:var(--g)}
.ax{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:4px}
.bars{display:grid;gap:8px}.bars div{display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;font-size:14.5px}.bars u{display:block;height:12px;border-radius:999px;background:#EEF0F3;overflow:hidden;text-decoration:none}.bars u i{display:block;height:100%;background:var(--g);border-radius:999px}
.todo{display:grid;gap:8px}.todo button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}.todo button:hover{border-color:var(--g)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}th{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:800}
tr.click{cursor:pointer}tr.click:hover td{background:#F9FAFB}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;background:#EEF0F3;color:var(--ink2)}.tag.pro{background:var(--gbg);color:var(--g)}.tag.business{background:#DCEBF9;color:#0A4F91}.tag.bad{background:#FDECEC;color:#B42318}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:200px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}.chips button.on{border-color:var(--g);background:var(--gbg);color:var(--g)}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;min-height:40px}.btn.o{background:#fff;color:var(--ink);border:1.5px solid #D0D5DD}.btn.bad{background:#fff;color:#B42318;border:1.5px solid #F9D0CE}
.pay{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.pay b{font-size:16px}.pay span{display:block;font-size:14px;color:var(--ink2)}.pay .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--ink2);padding:6px 0}
.help{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px}.hl{display:grid;gap:6px;align-content:start;max-height:520px;overflow:auto}.hl button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}.hl button.on{border-color:var(--g);background:#F6FBF8}.hl b{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}.dot{background:#D92D20;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}.hl small{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:340px;background:#fff}.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:420px}.m{max-width:85%;padding:9px 12px;border-radius:14px;background:#F2F4F7;white-space:pre-wrap}.m.me{align-self:flex-end;background:#DCF5E5}.m small{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.send textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:46px;resize:vertical}
.gate{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}.gate h1{font-size:22px}.gate label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}.gate input{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px}.gate .btn{width:100%;margin-top:16px;min-height:48px}.err{color:#B42318;font-weight:700;margin-top:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer{position:fixed;inset:0;background:rgba(16,24,40,.4);display:flex;justify-content:flex-end;z-index:20}.drawer[hidden]{display:none}.dp{width:min(520px,100%);background:#fff;height:100%;overflow:auto;padding:20px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14.5px}.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600}
/* layout B: menu on the left */
body.side .tin{max-width:none}body.side .tabs{display:none}body.side .wrapx{display:grid;grid-template-columns:220px minmax(0,1fr);min-width:0;max-width:1240px;margin:0 auto}
body.side .sidenav{display:flex;flex-direction:column;gap:4px;padding:22px 0 0 20px;position:sticky;top:60px;align-self:start}body.side .sidenav button{text-align:left;border:0;background:none;padding:11px 14px;border-radius:10px;font-weight:700;color:var(--ink2);cursor:pointer;display:flex;justify-content:space-between}body.side .sidenav button.on{background:var(--gbg);color:var(--g)}body.side .sidenav b{background:#D92D20;color:#fff;border-radius:50%;font-size:12.5px;width:22px;height:22px;display:grid;place-items:center;padding:0;line-height:1;flex:none}
.sidenav{display:none}
/* layout C: one page, no tabs */
body.one .tabs{display:none}body.one .sec{margin-bottom:34px}body.one .sec > h1{border-top:2px solid var(--line);padding-top:22px}body.one .sec:first-child > h1{border-top:0;padding-top:0}
.pv{background:#FEF9C3;border-bottom:1px solid #F5E58A;text-align:center;padding:8px 12px;font-weight:700;font-size:14.5px}
@media (max-width:860px){main{padding:16px 12px 50px;min-width:0;max-width:100vw;overflow-x:hidden}.card{padding:14px 12px;overflow-x:auto}input[type=file]{max-width:100%}body.side .wrapx{grid-template-columns:minmax(0,1fr)}body.side .sidenav button{flex:none}body.side .sidenav{flex-direction:row;flex-wrap:wrap;position:static;padding:10px 12px 0;min-width:0}body.side .sidenav button{padding:8px 12px}.grid{grid-template-columns:1fr 1fr}.help{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div class="top"><div class="tin"><div class="logo"><i>N</i>Nifti <small>Founder</small></div><nav class="tabs" id="tabs"></nav><span class="who" id="who"></span></div></div>
<div class="wrapx"><nav class="sidenav" id="sidenav"></nav><main id="main"><p class="sub">Loading…</p></main></div>
<div class="drawer" id="drawer" hidden onclick="if(event.target===this)this.hidden=true"><div class="dp" id="dp"></div></div>
<script>
const sb = supabase.createClient('https://ctryvcloavfpecbrbzxy.supabase.co', 'sb_publishable_oWW-IMSOeNNFiQDjUnpWdQ_hlezb7wS');
const QS = new URLSearchParams(location.search), LAYOUT = ['tabs', 'side', 'one'].includes(QS.get('layout')) ? QS.get('layout') : 'side', PREVIEW = QS.get('preview') === '1';
if(LAYOUT !== 'tabs') document.body.classList.add(LAYOUT);
const S = {tab: (location.hash || '#overview').slice(1), shops: [], growth: null, pays: [], inbox: [], openBiz: null, filter: 'all', q: ''};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const peso = n => '₱' + Math.round(Number(n) || 0).toLocaleString('en-US');
const ago = d => { if(!d) return '—'; const s = (Date.now() - new Date(d)) / 1000; if(s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago'; if(s < 86400) return Math.round(s / 3600) + ' h ago'; const dd = Math.round(s / 86400); return dd === 1 ? 'yesterday' : dd + ' days ago'; };
const planOf = p => p === 'business' ? 'business' : ['pro', 'supplier_pro', 'buyer_pro'].includes(p) ? 'pro' : 'free';
const planTag = p => { const k = planOf(p); return `<span class="tag ${k}">${k === 'free' ? 'Free' : k === 'pro' ? 'Pro' : 'Business'}</span>`; };
async function rpc(n, a){ const { data, error } = await sb.rpc(n, a || {}); if(error) throw new Error(error.message); return data; }
function toast(t){ const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:30'; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

async function boot(){
  if(PREVIEW){ document.body.insertAdjacentHTML('afterbegin', '<div class="pv">Preview with made-up numbers, to compare layouts. Your real page shows only real shops.</div>'); sample(); paint(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return gate();
  let ok = false; try{ ok = await rpc('is_platform_admin'); }catch(e){}
  if(!ok) return gate("This account isn't the founder's. Sign out and sign in with the founder's email.", session.user.email);
  $('who').innerHTML = `${esc(session.user.email)} · <button class="link" onclick="sb.auth.signOut().then(() => location.reload())">Sign out</button>`;
  await load(); paint();
}
function sample(){
  const d = []; for(let i = 29; i >= 0; i--){ const x = new Date(); x.setDate(x.getDate() - i); d.push({d: x.toISOString().slice(0, 10), n: Math.max(0, Math.round(Math.sin(i / 3) * 2 + (30 - i) / 6))}); }
  S.growth = {days: d, total: 64, free: 48, pro: 13, business: 3, people: 91, active_week: 37, mrr: 13 * 990 + 3 * 2990, pilot: false};
  const names = ['Santos Hardware', 'RJ Construction Supply', 'Aling Nena Store', 'Bayview Builders', 'Marikina Steel Depot', 'Golden Nail Trading'];
  S.shops = names.map((n, i) => ({id: 'x' + i, name: n, plan: ['pro', 'free', 'free', 'business', 'pro', 'free'][i], members: [4, 2, 1, 11, 6, 1][i], orders_30d: [42, 8, 3, 120, 37, 0][i], owner_email: 'owner' + (i + 1) + '@example.com', last_active: new Date(Date.now() - i * 864e5 * 2).toISOString(), created_at: new Date(Date.now() - (i + 2) * 864e5 * 5).toISOString()}));
  S.pays = [{id: 'p1', business_name: 'RJ Construction Supply', plan: 'pro', cycle: 'monthly', amount: 990, method: 'GCash', reference: '9012 345 678901', status: 'pending', created_at: new Date(Date.now() - 2 * 3600e3).toISOString()}];
  S.jobs = [{business_id: 'x1', business_name: 'RJ Construction Supply', plan: 'pro', status: 'waiting', note: 'Prices are in column C', file_path: null, requested_by: 'Ramon', items_added: 0, customers_added: 0, created_at: new Date(Date.now() - 5 * 3600e3).toISOString(), items_now: 0, customers_now: 0}];
  S.inbox = [{business_id: 'x3', business_name: 'Bayview Builders', plan: 'business', last_message: 'We have 90 people. Can we get a bigger plan?', unread: 1}];
  $('who').textContent = 'Preview';
}
function gate(msg, email){
  $('tabs').innerHTML = ''; $('who').innerHTML = email ? `<button class="link" onclick="sb.auth.signOut().then(() => location.reload())">Sign out</button>` : '';
  $('main').innerHTML = `<div class="gate"><h1>Founder sign in</h1><p class="sub">Only the founder of Nifti can open this page. No demo, no sample data.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
    <button class="btn" onclick="signIn()">Sign in</button><div class="err" id="gerr"></div>
    <p class="sub" style="margin-top:16px">First time? <a href="./#login">Create your account here</a> with the founder's email, then come back to this link.</p></div>`;
}
async function signIn(){
  $('gerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  if(error){ $('gerr').textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message; return; }
  boot();
}
async function load(){
  const r = await Promise.allSettled([rpc('admin_growth'), rpc('admin_businesses', {p_query: '', p_filter: 'all', p_limit: 200, p_offset: 0}), rpc('admin_upgrade_requests'), rpc('admin_help_inbox'), rpc('admin_setup_jobs')]);
  S.growth = r[0].value || {}; S.shops = r[1].value || []; S.pays = (r[2].value || []); S.inbox = r[3].value || []; S.jobs = r[4].value || [];
}
const TABS = [['overview', 'Overview'], ['shops', 'Subscriptions'], ['setups', 'Setups'], ['money', 'Money'], ['help', 'Help'], ['settings', 'AI & settings']];
function paint(){
  const pend = S.pays.filter(p => p.status === 'pending').length, unread = S.inbox.reduce((s, x) => s + (x.unread || 0), 0);
  const badge = {money: pend, help: unread, setups: (S.jobs || []).filter(j => j.status !== 'done').length};
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')">${l}${badge[k] ? `<b>${badge[k]}</b>` : ''}</button>`).join('');
  $('sidenav').innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')"><span>${l}</span>${badge[k] ? `<b>${badge[k]}</b>` : ''}</button>`).join('');
  if(LAYOUT === 'one') return onePage();
  ({overview, shops, setups, money, help, settings})[S.tab] ? ({overview, shops, setups, money, help, settings})[S.tab]() : overview();
}
async function onePage(){
  const parts = []; for(const f of [overview, money, help, setups, shops]){ await f(); parts.push('<section class="sec">' + $('main').innerHTML + '</section>'); }
  $('main').innerHTML = parts.join('');
}
function go(t){ S.tab = t; if(LAYOUT === 'one'){ paint(); const i = TABS.findIndex(x => x[0] === t); const sec = document.querySelectorAll('.sec')[[0, 4, 3, 1, 2][i]]; if(sec) sec.scrollIntoView({behavior: 'smooth'}); return; } location.hash = t; paint(); window.scrollTo(0, 0); }

async function settings(){
  $('main').innerHTML = `<h1>AI &amp; settings</h1><p class="sub">Switch on the AI that reads notebook pages and the files suppliers send in chat.</p><div class="card"><p class="empty">Loading…</p></div>`;
  let s = {}; if(PREVIEW){ s = {reader: false, reader_pages_month: 0}; } else { try{ s = await rpc('admin_service_status') || {}; }catch(e){ s = {}; } }
  const cost = Math.round((s.reader_pages_month || 0) * 2.5);
  $('main').innerHTML = `<h1>AI &amp; settings</h1><p class="sub">Switch on the AI that reads notebook pages and the files suppliers send in chat (invoices, price lists, delivery receipts).</p>
    <div class="card"><div class="sw"><h2 style="margin:0">AI reading</h2><span class="tag ${s.reader ? 'ok' : ''}" style="${s.reader ? 'background:#DCFCE7;color:#15803D' : 'background:#F2F4F7;color:#475467'}">${s.reader ? 'On' : 'Off'}</span></div>
      <p class="sub" style="margin:8px 0 12px">${s.reader ? `${s.reader_pages_month || 0} page${(s.reader_pages_month || 0) === 1 ? '' : 's'} and files read this month, about ₱${cost.toLocaleString('en-PH')} on your Anthropic bill.` : 'Off. Chats still spot quotations, invoices and deliveries from the words; reading the numbers inside files and notebook photos starts once this is on.'}</p>
      <ol style="margin:0 0 12px;padding-left:20px;line-height:1.7">
        <li>Open <b>platform.claude.com</b> (the Claude Console for developers) and sign in. This is separate from a claude.ai chat plan: a Pro or Max subscription does not cover it, and its billing is separate.</li>
        <li>If it asks, create an organization (any name, e.g. "Nifti").</li>
        <li>Go to <b>Settings → Billing</b>, add a card and tap <b>Buy credits</b>. US$10 is enough to start. A file from a chat costs about ₱0.20 to read; a handwritten notebook page about ₱2 to ₱3.</li>
        <li>On the same page, make sure <b>Auto-reload is off</b>. Then the credit you bought is the most you can ever spend: when it runs out, only AI reading pauses (the rest of Nifti keeps working) until you top up.</li>
        <li>Optional extra safety: <b>Settings → Limits</b>, set a monthly spend limit, e.g. US$20.</li>
        <li>Go to <b>Settings → API keys</b>, tap <b>Create key</b>, name it "Nifti", leave the workspace as Default, then copy the key. It starts with <code>sk-ant-</code> and is shown only once.</li>
        <li>Paste it below and tap Switch on. It's saved on the server only and never shown again, not even to you.</li></ol>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="aiKey" type="password" autocomplete="off" placeholder="Paste the key (sk-ant-...)" style="flex:1;min-width:220px;padding:12px 14px;border:1.5px solid #D0D5DD;border-radius:12px;font:inherit">
        <button class="btn" onclick="saveKey()">${s.reader ? 'Replace key' : 'Switch on'}</button>${s.reader ? `<button class="btn o" onclick="offKey()">Switch off</button>` : ''}</div>
      <p class="sub" style="margin:10px 0 0;font-size:13.5px">Each shop's monthly allowance still applies: Free 10, Pro 100, Business 400 pages a month, plus 300 extra pages in a shop's first 30 days to bring in its old notebooks. Worst case on your bill: about ₱250 a month for a Pro shop, ₱1,000 for a Business shop.</p></div>
    <div class="card"><h2 style="margin:0 0 6px">Facebook: nothing to set up on your side</h2>
      <p class="sub" style="margin:0 0 10px">Nifti uses Facebook's own free tools, so there is no Meta app, no App Review, no business documents and no cost. Posting straight to a shop's Page through an app would need Meta's Advanced Access (App Review plus Business Verification), and Facebook no longer lets any app post into Groups at all, so the share route is also the one that reaches Groups.</p>
      <ul style="margin:0 0 10px;padding-left:20px;line-height:1.7">
        <li><b>Posting:</b> on a phone, the share sheet opens with the picture attached and the words copied; shops pick Facebook (profile or group) or Business Suite (their Page). On a computer, the picture is copied so it pastes straight into Business Suite's post box, then the words.</li>
        <li><b>"How much?" replies and Messenger answers:</b> each shop switches on Facebook's free automations once (Online store → Answer buyers automatically). Nifti fills in the keywords, the reply with their store link, the instant reply and 4 common questions, ready to copy.</li>
        <li><b>Order button:</b> the same screen walks them through putting a "Shop now" button with their store link on their Page.</li></ul>
      <p class="sub" style="margin:0;font-size:13.5px">Store checkout (delivery fee by barangay, GCash, Maya or bank details) and shared store photos are already live in the database (applied 2026-11-19).</p></div>`;
}
async function saveKey(){
  const v = ($('aiKey').value || '').trim(); if(!v){ toast('Paste the key first.'); return; }
  if(!/^sk-ant-/.test(v)){ if(!confirm("That doesn't look like an Anthropic key (they start with sk-ant-). Save it anyway?")) return; }
  if(PREVIEW){ toast('Preview: nothing saved.'); return; }
  try{ await rpc('admin_set_secret', {p_name: 'anthropic_api_key', p_value: v}); $('aiKey').value = ''; toast('AI reading is on.'); settings(); }catch(e){ toast(e.message); }
}

async function suRead(input){

async function suAdd(){

  const cur = list.find(x => x.business_id === S.openBiz);
  $('main').innerHTML = `<h1>Help</h1><p class="sub">Questions, complaints and requests for more than 75 people. Business plan shops are listed first.</p>
    ${list.length ? `<div class="help"><div class="hl">${list.map(x => `<button class="${x.business_id === S.openBiz ? 'on' : ''}" onclick="S.openBiz='${x.business_id}'; help()"><b><span>${esc(x.business_name)}</span>${x.unread ? `<span class="dot">${x.unread}</span>` : ''}</b><small>${x.last_from_admin ? 'You: ' : ''}${esc(x.last_message || '')}</small></button>`).join('')}</div>
      <div class="th"><div class="msgs" id="msgs">${th.map(m => `<div class="m ${m.from_admin ? 'me' : ''}">${esc(m.message)}<small>${m.from_admin ? 'You' : esc(m.from_name || 'Shop')} · ${ago(m.created_at)}</small></div>`).join('')}</div>
        <div class="send"><textarea id="rep" placeholder="Answer ${esc(cur ? cur.business_name : '')}"></textarea><button class="btn" onclick="reply()">Send</button></div></div></div>`
      : '<div class="card"><p class="empty">No messages yet. When a shop taps "Need help?", it lands here and in your email.</p></div>'}`;
  const m = $('msgs'); if(m) m.scrollTop = m.scrollHeight;
  if(cur && cur.unread){ cur.unread = 0; paint(); }
}
async function reply(){ const t = $('rep').value.trim(); if(!t) return; try{ await rpc('admin_help_reply', {p_business: S.openBiz, p_message: t}); toast('Sent. They get an alert.'); S.inbox = await rpc('admin_help_inbox') || []; help(); }catch(e){ toast(e.message); } }
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if(t && t !== S.tab && TABS.some(x => x[0] === t)){ S.tab = t; paint(); } });
boot();
</script>
</body>
</html>
