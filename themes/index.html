<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nifti Theme Gallery</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#111827;--ink2:#4B5563;--line:#E5E7EB;--bg:#F3F4F6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) 8px;display:grid;gap:8px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.top p{margin:0;color:var(--ink2);font-size:12.5px;flex:1;min-width:200px}
.dev{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dev button{border:0;background:#fff;padding:7px 12px;font:600 13px Inter,sans-serif;color:var(--ink2);cursor:pointer;min-height:34px}
.dev button[aria-pressed="true"]{background:var(--ink);color:#fff}
.themes{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.th{flex:none;width:178px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:3px}
.th:hover{border-color:#9CA3AF}
.th[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.th b{font-size:13.5px;display:flex;justify-content:space-between;gap:6px} .th b span{color:#9CA3AF;font-weight:600}
.th small{font-size:11.5px;color:var(--ink2);line-height:1.3;height:30px;overflow:hidden}
.sw{display:flex;gap:3px;margin-top:2px}.sw i{width:22px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:600 12.5px Inter,sans-serif;color:var(--ink2);cursor:pointer;min-height:30px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button span{opacity:.55;margin-right:4px;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;display:flex;justify-content:center;padding:12px;overflow:auto}
.frame{width:100%;height:100%;min-height:500px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 20px 50px -30px rgba(17,24,39,.35);transition:width .25s}
.phone .frame{width:400px;max-width:100%;border-radius:28px;border:8px solid #111827}
iframe{width:100%;height:100%;border:0;display:block}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.note.on{opacity:1}
@media (max-width:640px){ .top p{display:none} .th{width:150px} main{padding:6px} .frame{border-radius:8px} .phone .frame{border-width:0;border-radius:8px} }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Nifti · Theme gallery</h1><p>Your real dashboard with demo data. Every tab, number and button is the same; each theme changes only the fonts, colour, spacing and design. Click around inside it too.</p>
    <div class="dev" role="group" aria-label="Screen size"><button type="button" data-dev="desk" aria-pressed="true">Desktop</button><button type="button" data-dev="phone" aria-pressed="false">Phone</button></div></div>
  <div class="themes" id="themes" role="group" aria-label="Themes"></div>
  <div class="tabs" id="tabs" role="group" aria-label="Tabs"></div>
</header>
<main id="main"><div class="frame"><iframe id="app" title="Nifti dashboard" src="../"></iframe></div></main>
<div class="note" id="note"></div>
<script>
const THEMES = [
  ['cur','Current','How it looks today','', ['#F6F4EF','#1F6B45','#15201A','#E4DFD3']],
  ['atelier','Atelier','Editorial private bank: serif titles, porcelain, deep teal','t01-atelier', ['#F5F6F8','#0E5E5B','#0F1A2B','#FFF4D9']],
  ['harbor','Harbor','Navy bridge sidebar, sea-blue actions, signal yellow','t02-harbor', ['#0E2238','#1565C0','#FFC940','#EEF3F8']],
  ['porcelain','Porcelain','Floating white panels, cobalt, pastel number tiles','t03-porcelain', ['#F2F4F9','#2B4BD8','#DDF4EA','#FFF0CC']],
  ['softbold','Soft Bold','Ink outlines, bright flat tiles, black pill buttons','t04-softbold', ['#121419','#FFE45C','#C9F5DC','#DCEBFF']],
  ['graphite','Graphite','Monochrome precision: hairlines, mono figures','t05-graphite', ['#FAFAFA','#0A0A0A','#737373','#EAEAEA']],
  ['nordic','Nordic','Airy and borderless, sage-blue, lots of space','t06-nordic', ['#EFF3F2','#2C6A6F','#FFFFFF','#E0EEEE']],
  ['metro','Metro','Transit-map signage; each menu group has its own colour','t07-metro', ['#F28C00','#0057B8','#00A651','#E4002B']],
  ['ledgerbook','Ledger Book',"An accountant's ruled book: serif, mono figures, stamps",'t08-ledgerbook', ['#EEF3F0','#1D3A8A','#122019','#CFDDD5']],
  ['skyline','Skyline','Every page opens with a bright banner; cards float below','t09-skyline', ['#1D4ED8','#0EA5E9','#F3F6FB','#FFFFFF']],
  ['workshop','Workshop','Steel greys and safety yellow for the hardware trade','t10-workshop', ['#15181D','#FFC20E','#ECEEF1','#FFFFFF']]
];
const TABS = [['dashboard','Home'],['orders','Orders'],['messages','Messages'],['suppliers','Customers & suppliers'],['inventory','Stock'],['money','Money overview'],['sales','Sales'],['expenses','Expenses'],['cashcount','Cash count'],['collections','Who owes you'],['profit','Profit & prices'],['issues','To check'],['ledger','Books & reports'],['bank','Bank & deposits'],['payroll','Payroll'],['close','Month-end close'],['store','Online store'],['prices','Price list'],['followups','Follow-ups'],['watchdog',"Owner's watchdog"],['team','Team'],['settings','Settings']];
const $ = s => document.querySelector(s), frame = $('#app');
const st = Object.assign({th:'atelier', tab:'dashboard', dev:'desk'}, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
let ready = false;
$('#themes').innerHTML = THEMES.map((t,i) => `<button type="button" class="th" data-th="${t[0]}"><b>${t[1]}<span>${i ? String(i).padStart(2,'0') : ''}</span></b><small>${t[2]}</small><span class="sw">${t[4].map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`).join('');
$('#tabs').innerHTML = TABS.map((t,i) => `<button type="button" data-tab="${t[0]}"><span>${i + 1}</span>${t[1]}</button>`).join('');
function note(m){ const n = $('#note'); n.textContent = m; n.classList.add('on'); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove('on'), 1600); }
function sync(){ document.querySelectorAll('.th').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === st.th)); document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === st.tab));
  document.querySelectorAll('.dev button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === st.dev)); $('#main').classList.toggle('phone', st.dev === 'phone');
  history.replaceState(null, '', '#' + new URLSearchParams({th:st.th, tab:st.tab, dev:st.dev})); }
function applyTheme(){ if(!ready) return; const d = frame.contentDocument, t = THEMES.find(x => x[0] === st.th);
  d.querySelectorAll('link[data-nth]').forEach(l => l.remove());
  if(t[0] === 'cur'){ d.documentElement.removeAttribute('data-th'); return; }
  ['neutral.css','base.css',t[3] + '.css'].forEach(f => { const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = new URL(f, location.href).href; l.dataset.nth = '1'; d.head.appendChild(l); });
  d.documentElement.setAttribute('data-th', t[0]); }
function openTab(){ if(!ready) return; const w = frame.contentWindow;
  try{ w.scrollTo(0, 0); if(st.tab === 'bank'){ w.colTab = 'cash'; w.pickLens('collections','supplier'); } else w.go(st.tab); }catch(e){ note('That tab could not open here.'); } }
frame.addEventListener('load', () => { const w = frame.contentWindow; let n = 0;
  const wait = setInterval(() => { n++; if(w.navigate && w.go){ clearInterval(wait); setTimeout(() => { try{ w.navigate('dashboard'); }catch(e){} ready = true; applyTheme(); openTab(); }, 500); } else if(n > 100){ clearInterval(wait); note('The dashboard did not load.'); } }, 100); });
$('#themes').addEventListener('click', e => { const b = e.target.closest('.th'); if(!b) return; st.th = b.dataset.th; sync(); applyTheme(); note(THEMES.find(t => t[0] === st.th)[1]); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; st.tab = b.dataset.tab; sync(); openTab(); });
document.querySelector('.dev').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; st.dev = b.dataset.dev; sync(); });
document.addEventListener('keydown', e => { if(e.target.tagName === 'INPUT') return; const i = THEMES.findIndex(t => t[0] === st.th);
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ st.th = THEMES[(i + (e.key === 'ArrowRight' ? 1 : THEMES.length - 1)) % THEMES.length][0]; sync(); applyTheme(); note(THEMES.find(t => t[0] === st.th)[1]); } });
sync();
</script>
</body>
</html>
