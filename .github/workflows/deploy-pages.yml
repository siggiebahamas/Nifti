name: Deploy Nifti to GitHub Pages

on:
  push:
    branches: ["claude/supabase-mcp-connection-j8plcc"]
  # Rebuild every 2 hours so new online stores get their own Facebook-ready page.
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight one finish rather than cancel it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nifti_Sept17.html stays the one source file in the repo; this just serves it as
      # index.html so the site works at the plain root URL, with zero risk of a second
      # copy drifting out of sync. manifest.json/sw.js/icon-512.png are referenced by
      # index.html itself (PWA manifest, service worker, favicon) and must sit alongside it
      # at the site root or those requests 404. robots.txt/sitemap.xml must also sit at the
      # site root — that's the only place search engines look for either by default.
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp Nifti_Sept17.html _site/index.html
          cp manifest.json sw.js icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png favicon-32.png favicon-48.png robots.txt sitemap.xml 404.html store.js _site/

      - name: Build online store pages
        run: node .github/scripts/build-stores.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
