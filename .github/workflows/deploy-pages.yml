name: Deploy Nifti to GitHub Pages

on:
  push:
    branches: ["claude/supabase-mcp-connection-j8plcc"]
  # Rebuild every 2 hours so new online stores get their own Facebook-ready page.
  # Round 72 rebuilt the landing at build time (u72_site) and the dashboard fixes from the revisions brief (u73_app).
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. A newer run replaces an older one: a run that got stuck
# "waiting" on Oct 6 held this group for three weeks and every deploy after it was cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Nifti from maintained source patches
        run: |
          git show 3bb6f02:Nifti_Sept17.html > dev/src/base.html
          cd dev/src
          node --check r52_wow.js
          node --check r63_growth.js
          node --check r65_ops.js
          node --check r67_workflow.js
          node --check r69_dashboard_ux.js
          node --check r70_product.js
          node --check r71_product.js
          node --check r72_site.js
          node --check r72.js
          node --check mhome.js
          node --check one.js
          node --check books_core.js
          node --check books_pages.js
          node --check books_ledger.js
          node --check books_ops.js
          python3 -m py_compile u35_site.py u63_growth.py u65_ops.py u67_workflow.py u68_product_ui.py u69_dashboard_ux.py u70_product.py u71_product.py u72_site.py u73_app.py
          python3 apply.py u1_data u2_shell u3_demo_stock u4_books u5_polish u6_i18n u7_more u8_plans u9_books2 u10_site u11_pricelock u12_stockrun u13_mhome u14_polish u15_round6 u16_round7 u17_round8 u18_round9 u19_round10 u20_round11 u21_round12 u22_round13 u23_round14 u24_round15 u25_round16 u26_round17 u27_round18 u28_round19 u29_round20 u30_round21 u31_round22 u32_round23 u33_round24 u34_round25 u35_round26 u36_round27 u37_round29 u38_round31 u39_round32 u40_round33 u42_round35 u43_round36 u44_round37 u45_round38 u46_round39 u47_round40 u48_round41 u49_round42 u50_round43 u51_round44 u52_round45 u53_round46 u54_round47 u55_round48 u56_round49 u57_round50 u58_round51 u59_round52 u60_round53 u61_round54 u62_cro u63_growth u65_ops u67_workflow u68_product_ui u69_dashboard_ux u70_product u71_product u72_site u73_app u97_black_text u98_demo_dates u99_dates u99z_scale
          cd ../..
          grep -q 'id="view-index"' Nifti_Sept17.html
          grep -q 'id="view-login"' Nifti_Sept17.html

      # Nifti_Sept17.html stays the one source file in the repo; this just serves it as
      # index.html so the site works at the plain root URL, with zero risk of a second
      # copy drifting out of sync. manifest.json/sw.js/icon-512.png are referenced by
      # index.html itself (PWA manifest, service worker, favicon) and must sit alongside it
      # at the site root or those requests 404. robots.txt/sitemap.xml must also sit at the
      # site root — that's the only place search engines look for either by default.
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp Nifti_Sept17.html _site/index.html
          cp manifest.json sw.js icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png favicon-32.png favicon-48.png robots.txt sitemap.xml 404.html store.js pay-qr.png founder.html privacy.html _site/
          cp beta-pauses.js _site/
          # Add the beta pause notice exactly once, before the real final body tag.
          # A global sed replacement corrupts JavaScript template strings that contain
          # literal </body> markup for printable receipts, truncating the main app script.
          python3 - <<'PY'
          from pathlib import Path

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          script = '<script src="./beta-pauses.js"></script>'
          if html.count(script) == 0:
              pos = html.rfind("</body>")
              if pos < 0:
                  raise SystemExit("Could not find final </body> tag in index.html")
              html = html[:pos] + script + html[pos:]
              page.write_text(html, encoding="utf-8")
          if html.count(script) != 1:
              raise SystemExit("Expected exactly one beta-pauses.js reference")
          if html.count("</body>") < 3:
              raise SystemExit("Unexpectedly low body-tag count; refusing to publish")
          PY
          # Final publishing guard: the beta script must be injected once, not into
          # receipt HTML templates or any other inline JavaScript string.
          python3 - <<'PY'
          from pathlib import Path
          html = Path("_site/index.html").read_text(encoding="utf-8")
          assert html.count('<script src="./beta-pauses.js"></script>') == 1
          assert html.rstrip().endswith("</html>")
          assert html.rfind("</body>") > html.rfind('<script src="./beta-pauses.js"></script>')
          PY
          # Design lab: standalone prototype of 10 dashboard concepts (sample data only), served at /design-lab/.
          cp -r design-lab _site/design-lab
          # Theme gallery: the real app in an iframe with 10 optional visual themes, served at /themes/.
          cp -r themes _site/themes
          cp -r templates _site/templates
          # Nifti for Android (brings Viber into Nifti), served at /app/nifti.apk with /app/version.json.
          cp -r app _site/app

      - name: Build online store pages
        run: node .github/scripts/build-stores.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '_site'

      # GitHub sometimes can't see a just-uploaded artifact for a few seconds ("No artifacts named ... were found").
      # A short pause before deploying avoids that failed first attempt.
      - name: Wait for the artifact to be visible
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
