<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nifti</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0B0F14;background:#fff;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box}
.i{width:72px;height:72px;border-radius:20px;background:#1F6B45;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:34px;font-weight:800}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 22px;max-width:320px}button{border:0;background:#1F6B45;color:#fff;font:inherit;font-weight:800;font-size:17px;border-radius:14px;padding:14px 28px;min-width:220px}</style></head>
<body><div><div class="i">N</div><h1>No internet right now</h1><p>Nifti needs a connection to load. Your Viber messages are kept on this phone and sent the moment you're back online.</p>
<button onclick="try{NiftiAndroid.retry()}catch(e){history.back()}">Try again</button></div>
<script>window.addEventListener('online',function(){try{NiftiAndroid.retry()}catch(e){}});</script></body></html>
